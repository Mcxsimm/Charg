const otpDistinct = () => [...new Set([...DB.data.devis.map(d => d.otp), ...DB.data.chantiers.map(c => c.otp), ...DB.data.factures.map(f => f.otp), ...DB.data.commandes.map(c => c.otp)].filter(Boolean))].sort();
const commandesParOtp = otp => DB.data.commandes.filter(c => c.otp === otp).reduce((s, c) => s + (+c.montantHT || 0), 0);
const inMonth = (iso, mois, annee) => { if (!iso) return false; const d = new Date(iso + 'T00:00:00'); return d.getMonth() === mois && d.getFullYear() === annee; };
// Fournitures = commandes RÉCEPTIONNÉES sur l'OTP durant le mois donné
const commandesRecuesOtp = (otp, mois, annee) => DB.data.commandes.filter(c => c.otp === otp && c.dateReception && inMonth(c.dateReception, mois, annee)).reduce((s, c) => s + (+c.montantHT || 0), 0);
// Heures de main d'œuvre pointées sur l'OTP durant le mois (modèle en lignes)
function heuresMoOtp(otp, mois, annee) {
  let s = 0;
  DB.data.pointages.forEach(r => { if (r.otp !== otp || !r.h) return; r.h.forEach((h, i) => { if (h && inMonth(addDays(r.semaine, i), mois, annee)) s += +h; }); });
  return s;
}
// Taux horaire propre à un compagnon (chef/compagnon d'une équipe) ; à défaut, taux global
function tauxWorker(workerKey) {
  const g = +DB.data.objectifs.tauxHoraireMO || 0;
  if (!workerKey) return g;
  const role = /:chef$/.test(workerKey) ? 'chef' : 'comp';
  const eqId = workerKey.replace(/:(chef|comp)$/, '');
  const e = DB.data.equipes.find(x => x.id === eqId);
  if (!e) return g;
  const t = role === 'chef' ? e.tauxChef : e.tauxComp;
  return (t === undefined || t === null || t === '') ? g : (+t || 0);
}
// Coût MO SMAC imputé sur l'OTP (Σ heures × taux horaire de chaque compagnon)
function moParOtp(otp, mois, annee) {
  let s = 0;
  DB.data.pointages.forEach(r => { if (r.otp !== otp || !r.h) return; const taux = tauxWorker(r.workerKey); r.h.forEach((h, i) => { if (h && inMonth(addDays(r.semaine, i), mois, annee)) s += (+h) * taux; }); });
  return s;
}

const BTE_CATS = ['1 . Sous-traitance', "2 . Main d'œuvre", '3 . Fournitures', '4 . Matériel / Location', "5 . Frais d'études", '6 . Frais connexe'];

  const oldMap = { 'Sous-traitance': BTE_CATS[0], "Main d'œuvre": BTE_CATS[1], 'Fournitures': BTE_CATS[2], 'Engins / matériel': BTE_CATS[3], 'Autres': BTE_CATS[5] };

/* ---------- Cadences étanchéité ---------- */
let cadMetier = 'etancheite';
const CAD_STATE = {}; // par métier : { equipe, appro, coeff:{}, surf:{}, lin:{}, inputs:{} }
function cadInit(metier) {
  const cfg = CAD_METIERS[metier];
  if (CAD_STATE[metier]) return CAD_STATE[metier];
  const st = { equipe: 2, appro: cfg.appro.def ?? 0, coeff: {}, surf: {}, lin: {}, inputs: {} };
  for (const k in cfg.coeffs) st.coeff[k] = cfg.coeffs[k].def ?? cfg.coeffs[k].opts.findIndex(o => o[1] === 1) ?? 0;
  for (const k in cfg.tasksSurf) st.surf[k] = cfg.tasksSurf[k].def ?? 0;
  for (const k in cfg.tasksLin) st.lin[k] = cfg.tasksLin[k].def ?? 0;
  cfg.inputs.forEach(i => st.inputs[i.key] = i.def ?? 0);
  CAD_STATE[metier] = st; return st;
}
function cadCompute(metier) {
  const cfg = CAD_METIERS[metier], st = cadInit(metier), steps = [];
  let gc = 1; for (const k in cfg.coeffs) gc *= cfg.coeffs[k].opts[st.coeff[k]] ? cfg.coeffs[k].opts[st.coeff[k]][1] : 1;
  const surf = +st.inputs['surface'] || 0;
  for (const k in cfg.tasksSurf) { const o = cfg.tasksSurf[k].opts[st.surf[k]]; if (!o || !o[1]) continue; const hM2 = o[1] * gc; steps.push({ nom: cfg.tasksSurf[k].label, detail: o[0], base: o[1] + ' h/m²', h: hM2 * surf, cad: hM2 ? HEURES_JOUR / hM2 : 0, unite: 'm²/j' }); }
  const apr = cfg.appro.opts[st.appro]; if (apr && apr[1]) { const hM2 = apr[1] * gc; steps.push({ nom: 'Approvisionnement', detail: apr[0], base: apr[1] + ' h/m²', h: hM2 * surf, cad: hM2 ? HEURES_JOUR / hM2 : 0, unite: 'm²/j' }); }
  for (const k in cfg.tasksLin) { const t = cfg.tasksLin[k], o = t.opts[st.lin[k]]; if (!o || !o[1]) continue; const inp = cfg.inputs.find(i => i.key === t.input) || { unit: 'mL' }; const metr = +st.inputs[t.input] || 0; const hU = o[1] * gc; steps.push({ nom: t.label, detail: o[0], base: o[1] + ' h/' + inp.unit, h: hU * metr, cad: hU ? HEURES_JOUR / hU : 0, unite: inp.unit + '/j' }); }
  const totalH = steps.reduce((s, x) => s + x.h, 0);
  const jours = totalH / (Math.max(1, st.equipe) * HEURES_JOUR);
  const cadGlob = jours > 0 ? surf / jours : 0;
  return { cfg, st, gc, steps, totalH, jours, cadGlob, surf };
}

  const selTask = (bag, k) => { const c = (bag === 'surf' ? cfg.tasksSurf : cfg.tasksLin)[k], unit = bag === 'surf' ? 'h/m²' : 'h/' + ((cfg.inputs.find(i => i.key === c.input) || {}).unit || 'mL'); return `<div class="field"><label>${c.label}</label><select data-task="${bag}:${k}">${c.opts.map((o, i) => `<option value="${i}" ${st[bag][k] === i ? 'selected' : ''}>${o[0]}${o[1] ? ' — ' + o[1] + ' ' + unit : ''}</option>`).join('')}</select></div>`; };
  const inputField = i => `<div class="field"><label>${i.label}</label><input data-input="${i.key}" type="number" min="0" step="any" value="${st.inputs[i.key]}"></div>`;
  v.innerHTML = `

    <p class="t-muted" style="margin:-2px 0 16px;max-width:840px">Estimateur de cadences — <b>${cfg.label}</b>. Renseignez les caractéristiques du chantier, les coefficients de complexité et les ouvrages retenus : l'outil calcule le temps de pose, la durée équipe et la cadence globale. Les temps unitaires sont <b>indicatifs (standards métier)</b> et ajustables.</p>

          <div class="field"><label>Taille de l'équipe (personnes)</label><input data-eq type="number" min="1" value="${st.equipe}"></div>
        </div>

  $$('[data-metier]', v).forEach(b => b.onclick = () => { cadMetier = b.dataset.metier; renderCadences(v); });
  const readInputs = () => {

  };
  const recompute = () => { readInputs(); $('#cad-out').innerHTML = cadencesResult(); const b = $('#cad-csv'); if (b) b.onclick = exportCadences; const ib = $('#cad-bte'); if (ib) ib.onclick = importCadenceToBte; };
  v.querySelectorAll('.card input,.card select').forEach(el => el.oninput = recompute);

function importCadenceToBte() {

    $$('[data-delv]', v).forEach(b => b.onclick = () => confirmDialog('Supprimer cette visite ?', () => { DB.data.visites = DB.data.visites.filter(x => x.id !== b.dataset.delv); DB.save(); toast('Visite supprimée'); renderEntretien(v); }));
  }
}

/* ---------- Planning & pointages ---------- */
function mondayISO(d = new Date()) { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); return isoDate(x); }
let planWeek = mondayISO();
let planTab = 'mois';
function renderPlanning(v) {
  v.innerHTML = `<div class="pill-tabs">
    <button data-t="mois" class="${planTab === 'mois' ? 'active' : ''}">${icon('calendar')} Calendrier du mois</button>
    <button data-t="semaine" class="${planTab === 'semaine' ? 'active' : ''}">${icon('clock')} Pointages (semaine)</button></div>
    <div id="plan-body"></div>`;
  $$('[data-t]', v).forEach(b => b.onclick = () => { planTab = b.dataset.t; renderPlanning(v); });
  const host = $('#plan-body', v);
  if (planTab === 'mois') renderCalendar(host); else renderPointages(host);
}
function planWorkers() {
  const out = [];
  DB.data.equipes.forEach(e => {
    if (e.chef) out.push({ key: e.id + ':chef', nom: e.chef, equipeId: e.id, role: 'Chef', equipe: e.nom });
    if (e.compagnon) out.push({ key: e.id + ':comp', nom: e.compagnon, equipeId: e.id, role: 'Compagnon', equipe: e.nom });
  });
  return out;
}
const JSEM = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const TYPE_HEURE = { HT: 'HT - H Travaillées', HS: 'HS - H Supplémentaires', GD: 'GD - Grand déplacement', ABS: 'ABS - Absence', CP: 'CP - Congés payés', INT: 'INT - Intempéries' };
let planWorkerKey = '', planWE = false;
const HEBDO_H = 40;
function renderPointages(v) {
  const workers = planWorkers();
  if (!workers.length) { v.innerHTML = `<div class="page-actions"><button class="btn" id="teams">${icon('users')} Gérer les équipes</button></div>` + emptyState('users', 'Aucun compagnon', 'Ajoutez vos équipes (chef + compagnon) via « Gérer les équipes ».'); $('#teams', v).onclick = () => equipesModal(); return; }
  if (!workers.find(w => w.key === planWorkerKey)) planWorkerKey = workers[0].key;

        <div class="ts-prog"><div class="ts-prog-lbl">${num(persoTot)} H / ${HEBDO_H}.00 H · ${eur(tauxWorker(worker.key))}/h → ${eur(persoTot * tauxWorker(worker.key))}</div><div class="progress ${prog >= 100 ? 'green' : prog >= 60 ? '' : 'amber'}"><i style="width:${prog}%"></i></div></div>

      <button class="btn small" id="csv">${icon('download')} CSV</button>
      <button class="btn primary" id="add">${icon('plus')} Ajouter</button>

  const bind = () => {

    $('#wk', v).onchange = e => { planWeek = mondayISO(new Date(e.target.value + 'T00:00:00')); renderPointages(v); };
    $('#teams', v).onclick = () => equipesModal();
    $('#add', v).onclick = () => { DB.data.pointages.push({ id: uid(), workerKey: planWorkerKey, workerNom: worker.nom, equipeId: worker.equipeId, semaine: planWeek, categorie: '3000111', typeHeure: 'HT', otp: '', chantierNom: '', h: [0, 0, 0, 0, 0, 0, 0], panier: 0, trajet: 0, zone: '' }); DB.save(); renderPointages(v); };
    $('#csv', v).onclick = () => exportXlsx('pointages_' + esc(worker.nom) + '_' + planWeek, ['categorie', 'type', 'imputation', ...days.map(i => JSEM[i]), 'total', 'panier', 'trajet', 'zone'], rows.map(r => [r.categorie, r.typeHeure, r.otp, ...days.map(i => r.h[i] || 0), rowTot(r), r.panier, r.trajet, r.zone]), { sheet: 'Pointages', money: [] });
    $$('#ts-body tr', v).forEach(tr => {
      const r = DB.data.pointages.find(x => x.id === tr.dataset.id);
      tr.querySelectorAll('.ts-h').forEach(inp => inp.oninput = () => { r.h[+inp.dataset.i] = +inp.value || 0; DB.save(); refreshTot(); });
      tr.querySelectorAll('.ts-f').forEach(f => f.onchange = () => { const k = f.dataset.k; r[k] = (k === 'panier' || k === 'trajet') ? (+f.value || 0) : f.value; if (k === 'otp') { const c = DB.data.chantiers.find(x => x.otp === f.value); r.chantierNom = c ? c.nom : ''; } DB.save(); });
      tr.querySelector('[data-del]').onclick = () => { DB.data.pointages = DB.data.pointages.filter(x => x.id !== r.id); DB.save(); renderPointages(v); };
    });
  };
  const refreshTot = () => {
    const rws = DB.data.pointages.filter(r => r.workerKey === planWorkerKey && r.semaine === planWeek);
    $$('#ts-body tr', v).forEach(tr => { const r = rws.find(x => x.id === tr.dataset.id); if (r) tr.querySelector('.rtot').textContent = num(rowTot(r)); });
    days.forEach(i => { const el = v.querySelector(`.ctot[data-i="${i}"]`); if (el) el.textContent = num(rws.reduce((s, r) => s + (r.h && r.h[i] ? +r.h[i] : 0), 0)); });
    const pt = rws.reduce((s, r) => s + rowTot(r), 0);
    $('#ts-grand', v).textContent = num(pt);
    const pr = Math.min(100, Math.round(pt / HEBDO_H * 100));
    v.querySelector('.ts-prog-lbl').textContent = num(pt) + ' H / ' + HEBDO_H + '.00 H';
    const bar = v.querySelector('.ts-prog .progress'); bar.className = 'progress ' + (pr >= 100 ? 'green' : pr >= 60 ? '' : 'amber'); bar.querySelector('i').style.width = pr + '%';
  };
  bind();
  return;
}

/* ---------- Calendrier du mois (agenda perso + équipes) ---------- */
const AGENDA_TYPES = { perso: 'Perso / bureau', chantier: 'Équipe sur chantier', reunion: 'Réunion / RDV', conges: 'Congés / absence', autre: 'Autre' };
const TEAM_PALETTE = ['#2568b3', '#1f7a4d', '#9a6700', '#5b3fb0', '#b3261e', '#0e7490', '#be185d', '#4d7c0f'];
const teamColor = id => { const i = DB.data.equipes.findIndex(e => e.id === id); return i < 0 ? '#64748b' : TEAM_PALETTE[i % TEAM_PALETTE.length]; };
const typeColor = t => ({ perso: '#475569', reunion: '#5b3fb0', conges: '#b3261e', autre: '#0e7490' }[t] || '#475569');
let planMonth = new Date().getMonth(), planYear = new Date().getFullYear();
let planFilter = { perso: true, equipes: true };
// Étiquette d'un événement agenda : heure de début en préfixe + libellé
const agEventLabel = (a, base) => (a.heureDebut ? a.heureDebut + ' ' : '') + base;
// Détail des compagnons pour l'infobulle
const agCompTip = a => (a.companions && a.companions.length) ? '\n👥 ' + a.companions.join(', ') : '';
function dayEvents(iso, dateObj) {
  const evs = [];
  if (planFilter.perso) {
    DB.data.agenda.filter(a => a.type !== 'chantier' && a.dateDebut && iso >= a.dateDebut && iso <= (a.dateFin || a.dateDebut)).forEach(a => evs.push({ color: typeColor(a.type), label: agEventLabel(a, a.title), tip: agEventLabel(a, a.title) + agCompTip(a), agendaId: a.id }));
    DB.data.prospection.filter(p => p.date === iso).forEach(p => evs.push({ color: '#2568b3', label: 'RDV · ' + p.nom, route: 'prospection' }));
    DB.data.visites.filter(x => x.datePrevue === iso).forEach(x => { const c = DB.data.contrats.find(y => y.id === x.contratId); evs.push({ color: '#9a6700', label: 'Visite · ' + (c ? clientNom(c.clientId) : ''), route: 'entretien' }); });
  }
  if (planFilter.equipes) {
    DB.data.agenda.filter(a => a.type === 'chantier' && a.dateDebut && iso >= a.dateDebut && iso <= (a.dateFin || a.dateDebut)).forEach(a => { const eq = DB.data.equipes.find(e => e.id === a.equipeId); const base = (eq ? eq.nom + ' · ' : '') + a.title; evs.push({ color: teamColor(a.equipeId), label: agEventLabel(a, base), tip: agEventLabel(a, base) + agCompTip(a), agendaId: a.id }); });
    DB.data.pointages.forEach(r => { if (!r.h) return; const di = daysBetween(r.semaine, iso); if (di >= 0 && di < 7 && r.h[di]) evs.push({ color: teamColor(r.equipeId), label: r.workerNom + ' · ' + (r.chantierNom || r.otp || ''), route: 'planning-sem' }); });
  }
  return evs;
}
function renderCalendar(v) {
  const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const first = new Date(planYear, planMonth, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const gridStart = new Date(planYear, planMonth, 1 - startOffset);
  const cells = []; for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }
  const iso = d => isoDate(d);
  const cellHtml = d => {
    const inMo = d.getMonth() === planMonth, isoD = iso(d), isToday = isoD === todayISO();
    const evs = dayEvents(isoD, d);
    const shown = evs.slice(0, 4);
    return `<div class="cal-cell ${inMo ? '' : 'out'} ${isToday ? 'today' : ''}" data-day="${isoD}">
      <div class="cal-daynum">${d.getDate()}</div>
      ${shown.map((e, i) => `<span class="cal-ev" style="background:${e.color}" ${e.agendaId ? `data-ev="${e.agendaId}"` : e.route ? `data-route="${e.route}"` : ''} title="${esc(e.tip || e.label)}">${esc(e.label)}</span>`).join('')}
      ${evs.length > 4 ? `<div class="cal-more">+ ${evs.length - 4}</div>` : ''}</div>`;
  };
  v.innerHTML = `
    <div class="page-actions">
      <button class="btn primary" id="c-add">${icon('plus')} Événement</button>
      <button class="btn" id="c-teams">${icon('users')} Équipes</button>
      <span class="spacer"></span>
      <button class="btn small" id="c-prev">◀</button>
      <span class="chip" style="min-width:150px;justify-content:center">${MOIS[planMonth]} ${planYear}</span>
      <button class="btn small" id="c-next">▶</button>
      <button class="btn small" id="c-today">Aujourd'hui</button>
    </div>
    <div class="filters">
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="c-fperso" ${planFilter.perso ? 'checked' : ''}> Mon planning (RDV, visites, perso)</label>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="c-fequipes" ${planFilter.equipes ? 'checked' : ''}> Compagnons / équipes</label>
      ${DB.data.equipes.map(e => `<span class="chip"><i style="width:10px;height:10px;border-radius:3px;background:${teamColor(e.id)};display:inline-block"></i> ${esc(e.nom)}</span>`).join('')}
    </div>
    <div class="cal-wrap"><div class="cal-inner">
      <div class="cal-grid cal-head">${JOURS.map(j => `<div class="cal-hd">${j}</div>`).join('')}</div>
      <div class="cal-grid">${cells.map(cellHtml).join('')}</div>
    </div></div>`;
  $('#c-add').onclick = () => agendaForm();
  $('#c-teams').onclick = () => equipesModal();
  $('#c-prev').onclick = () => { planMonth--; if (planMonth < 0) { planMonth = 11; planYear--; } renderPlanning($('#view')); };
  $('#c-next').onclick = () => { planMonth++; if (planMonth > 11) { planMonth = 0; planYear++; } renderPlanning($('#view')); };
  $('#c-today').onclick = () => { planMonth = new Date().getMonth(); planYear = new Date().getFullYear(); renderPlanning($('#view')); };
  $('#c-fperso').onchange = e => { planFilter.perso = e.target.checked; renderPlanning($('#view')); };
  $('#c-fequipes').onchange = e => { planFilter.equipes = e.target.checked; renderPlanning($('#view')); };
  $$('.cal-cell', v).forEach(cell => cell.onclick = e => { if (e.target.closest('[data-ev]') || e.target.closest('[data-route]')) return; agendaForm(null, cell.dataset.day); });
  $$('[data-ev]', v).forEach(el => el.onclick = e => { e.stopPropagation(); agendaForm(el.dataset.ev); });
  $$('[data-route]', v).forEach(el => el.onclick = e => { e.stopPropagation(); const r = el.dataset.route; if (r === 'planning-sem') { planTab = 'semaine'; renderPlanning($('#view')); } else go(r); });
}
function agendaForm(id, presetDate) {
  const a = id ? DB.data.agenda.find(x => x.id === id) : { title: '', type: 'perso', dateDebut: presetDate || todayISO(), dateFin: '', heureDebut: '', heureFin: '', equipeId: (DB.data.equipes[0] || {}).id || '', companions: [], otp: '', note: '' };
  const eqOpts = DB.data.equipes.map(e => `<option value="${e.id}" ${a.equipeId === e.id ? 'selected' : ''}>${esc(e.nom)} (${esc(e.chef)})</option>`).join('');
  // Compagnons connus (chefs + compagnons de toutes les équipes), dédoublonnés par nom
  const knownNames = [...new Set(planWorkers().map(w => w.nom).filter(Boolean))];
  const selected = Array.isArray(a.companions) ? a.companions.filter(Boolean) : [];
  const extraNames = selected.filter(n => !knownNames.includes(n));
  const compChecks = knownNames.length
    ? knownNames.map((n, i) => `<label class="chip" style="cursor:pointer"><input type="checkbox" class="a-comp" value="${esc(n)}" ${selected.includes(n) ? 'checked' : ''}> ${esc(n)}</label>`).join('')
    : '<span class="t-muted" style="font-size:12px">Aucune équipe enregistrée — ajoutez des noms ci-dessous.</span>';
  const m = modal({ title: id ? "Modifier l'événement" : 'Nouvel événement',
    body: `<div class="form-grid">
      <div class="field"><label>Type</label><select id="a-type">${Object.entries(AGENDA_TYPES).map(([k, l]) => `<option value="${k}" ${a.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field" id="a-eqwrap"><label>Équipe de référence (optionnel)</label><select id="a-eq"><option value="">—</option>${eqOpts}</select></div>
      <div class="field full"><label>Intitulé</label><input id="a-title" value="${esc(a.title)}" placeholder="RDV client, chantier, congés…"></div>
      <div class="field"><label>Du</label><input id="a-deb" type="date" value="${a.dateDebut || todayISO()}"></div>
      <div class="field"><label>Au (optionnel)</label><input id="a-fin" type="date" value="${a.dateFin || ''}"></div>
      <div class="field"><label>Heure de début</label><input id="a-hdeb" type="time" value="${esc(a.heureDebut || '')}"></div>
      <div class="field"><label>Heure de fin (optionnel)</label><input id="a-hfin" type="time" value="${esc(a.heureFin || '')}"></div>
      <div class="field full"><label>Compagnons — équipe composée pour ce rendez-vous</label>
        <div class="a-comp-list" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:var(--panel-3);border-radius:8px">${compChecks}</div>
        <input id="a-compextra" value="${esc(extraNames.join(', '))}" placeholder="Autres compagnons (séparés par des virgules)" style="margin-top:8px">
        <div class="hint">Cochez les compagnons présents ce jour-là ; l'équipe peut changer à chaque rendez-vous.</div>
      </div>
      <div class="field"><label>OTP (optionnel)</label><input id="a-otp" value="${esc(a.otp)}" list="a-otplist"><datalist id="a-otplist">${otpDistinct().map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>
      <div class="field"><label>Note</label><input id="a-note" value="${esc(a.note)}"></div>
    </div>`,
    footer: `${id ? `<button class="btn danger" id="a-del">${icon('trash')} Supprimer</button>` : ''}<span class="spacer"></span><button class="btn" data-c>Annuler</button><button class="btn primary" id="a-save">Enregistrer</button>` });
  m.root.querySelector('.modal-foot').style.justifyContent = 'flex-start';
  m.root.querySelector('[data-c]').onclick = m.close;
  if (id) $('#a-del').onclick = () => { DB.data.agenda = DB.data.agenda.filter(x => x.id !== id); DB.save(); m.close(); toast('Événement supprimé'); renderPlanning($('#view')); };
  const collectCompanions = () => {
    const checked = $$('.a-comp', m.root).filter(c => c.checked).map(c => c.value);
    const extra = ($('#a-compextra').value || '').split(',').map(s => s.trim()).filter(Boolean);
    return [...new Set([...checked, ...extra])];
  };
  $('#a-save').onclick = () => {
    const type = $('#a-type').value;
    const obj = { title: $('#a-title').value.trim(), type, equipeId: $('#a-eq').value, companions: collectCompanions(), dateDebut: $('#a-deb').value, dateFin: $('#a-fin').value, heureDebut: $('#a-hdeb').value, heureFin: $('#a-hfin').value, otp: $('#a-otp').value.trim(), note: $('#a-note').value.trim() };
    if (!obj.title) { toast("L'intitulé est obligatoire", 'err'); return; }
    if (!obj.dateDebut) { toast('La date est obligatoire', 'err'); return; }
    if (obj.heureFin && obj.heureDebut && obj.heureFin < obj.heureDebut) { toast("L'heure de fin est avant l'heure de début", 'err'); return; }
    if (id) Object.assign(a, obj); else DB.data.agenda.unshift({ id: uid(), ...obj });
    DB.save(); m.close(); toast('Événement enregistré'); planTab = 'mois'; renderPlanning($('#view'));
  };
}

/* ---------- Achats fournisseurs (imputés sur OTP) ---------- */
const STATUTS_CMD = { commande: 'Commandée', livree: 'Livrée', facturee: 'Facturée' };
function cmdBadge(s) { const map = { commande: 'b-attente', livree: 'b-envoye', facturee: 'b-accepte' }; return `<span class="badge ${map[s] || 'b-attente'}">${STATUTS_CMD[s] || s}</span>`; }
let achatFilter = { q: '', otp: '' };

/* Exporteur Excel générique — remplace les anciens CSV.

   opts.money : liste des en-têtes monétaires (défaut : détection auto ; passer [] pour aucun). */
function exportXlsx(name, headers, rows, opts) {
  opts = opts || {};

  const isMoney = (h, ci) => auto ? !nonMoney(h) : (moneySet.has(h) || moneySet.has(String(ci)));
  const out = [headers.map(h => ({ v: h, s: 4 }))];
  const colNum = headers.map(() => false);
  rows.forEach(r => {
    out.push(headers.map((h, ci) => {
      const cell = r[ci];
      if (typeof cell === 'number') { colNum[ci] = true; return { v: cell, s: isMoney(h, ci) ? 8 : (Number.isInteger(cell) ? 9 : 5) }; }
      return { v: cell == null ? '' : String(cell), s: 2 };
    }));
  });
  if (opts.totals !== false && rows.length) {
    out.push(headers.map((h, ci) => {
      if (!colNum[ci]) return { v: ci === 0 ? 'TOTAL' : '', s: 4 };
      const sum = rows.reduce((a, r) => a + (typeof r[ci] === 'number' ? r[ci] : 0), 0);
      return { v: sum, s: isMoney(h, ci) ? 10 : 13 };
    }));
  }
  const filterRef = 'A1:' + _colL(headers.length - 1) + '1';
  writeXlsxBook(name + '.xlsx', [{ name: (opts.sheet || 'Données').slice(0, 31), rows: out, widths: _autoWidths(headers, rows), opts: { freeze: true, filterRef } }]);
  toast('Export Excel généré');
}

function _dxe(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
// Un paragraphe : le texte peut contenir des retours à la ligne (rendus en <w:br/>).
function _dp(text, o) {
  o = o || {};
  const runs = String(text == null ? '' : text).split('\n')
    .map((l, i) => (i ? '<w:br/>' : '') + `<w:t xml:space="preserve">${_dxe(l)}</w:t>`).join('');
  const rPr = `<w:rPr>${o.b ? '<w:b/>' : ''}${o.i ? '<w:i/>' : ''}${o.sz ? `<w:sz w:val="${o.sz}"/>` : ''}${o.color ? `<w:color w:val="${o.color}"/>` : ''}</w:rPr>`;
  const pPr = `<w:pPr>${o.style ? `<w:pStyle w:val="${o.style}"/>` : ''}${o.jc ? `<w:jc w:val="${o.jc}"/>` : ''}${o.ind ? `<w:ind w:left="${o.ind}"/>` : ''}${o.keep ? '<w:keepNext/>' : ''}</w:pPr>`;
  return `<w:p>${pPr}<w:r>${rPr}${runs}</w:r></w:p>`;
}
function _dcell(text, o) {
  o = o || {};
  const shd = o.fill ? `<w:shd w:val="clear" w:fill="${o.fill}"/>` : '';
  const w = o.w ? `<w:tcW w:w="${o.w}" w:type="dxa"/>` : '';
  return `<w:tc><w:tcPr>${w}${shd}<w:vAlign w:val="center"/></w:tcPr>${_dp(text, o)}</w:tc>`;
}
function _dtable(head, rows, widths) {
  const bd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV']
    .map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="9AA7B8"/>`).join('');
  // Word et LibreOffice attendent une grille complète : autant de gridCol que de colonnes.
  const nCols = Math.max((head || []).length, ...(rows || []).map(r => r.length), 1);
  const w = (widths && widths.length === nCols) ? widths : Array.from({ length: nCols }, () => Math.round(9300 / nCols));
  const grid = w.map(x => `<w:gridCol w:w="${x}"/>`).join('');
  widths = w;
  let xml = `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>`;
  if (head && head.length) {
    xml += `<w:tr><w:trPr><w:tblHeader/></w:trPr>` +
      head.map((h, i) => _dcell(h, { b: true, fill: 'E7EDF5', w: widths && widths[i] })).join('') + `</w:tr>`;
  }
  (rows || []).forEach(r => {
    xml += '<w:tr>' + r.map((c, i) => _dcell(c, { w: widths && widths[i] })).join('') + '</w:tr>';
  });
  return xml + '</w:tbl>' + _dp('', { sz: 8 });
}
// Convertit la liste de blocs commune (aperçu HTML / Word) en corps document.xml
function _docxBody(blocks) {
  let out = '';
  blocks.forEach(b => {
    switch (b.k) {
      case 'cover': out += _dp(b.t, { style: 'Cover' }); break;
      case 'h1': out += _dp(b.t, { style: 'T1', keep: true }); break;
      case 'h2': out += _dp(b.t, { style: 'T2', keep: true }); break;
      case 'h3': out += _dp(b.t, { style: 'T3', keep: true }); break;
      case 'p': out += _dp(b.t, { b: b.b, i: b.i, jc: b.jc, color: b.color }); break;
      case 'note': out += _dp(b.t, { i: true, color: '5A6B80' }); break;
      case 'ul': out += (b.items || []).map(t => _dp('•  ' + t, { ind: 260 })).join(''); break;
      case 'chk': out += (b.items || []).map(it => _dp((it[1] ? '☒  ' : '☐  ') + it[0], { ind: 260, b: !!it[1] })).join(''); break;
      case 'kv': out += _dtable(null, (b.rows || []).map(r => [r[0], r[1]]), [3200, 6100]); break;
      case 'tab': out += _dtable(b.head, b.rows, b.w); break;
      case 'pb': out += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`; break;
      case 'sp': out += _dp(''); break;
    }
  });
  return out;
}

    { name: 'word/styles.xml', data: enc.encode(_DOCX_STYLES) },

const dtx = (r, k, d) => { const v = r[k]; return (v === undefined || v === null || v === '') ? (d === undefined ? '—' : d) : String(v); };
const dck = (r, k) => Array.isArray(r[k]) ? r[k] : [];
const dls = (r, k) => (Array.isArray(r[k]) ? r[k] : []).filter(row => row.some(c => String(c || '').trim()));
const dda = (r, k) => { const v = r[k]; return v ? fmtDate(v) : '—'; };
const dOn  = (r, k, lbl) => dck(r, k).includes(lbl);
// Liste de cases à cocher : toutes les options du champ, cochées selon la réponse.
function chkItems(champ, r) {
  const on = dck(r, champ.k);
  return (champ.opts || []).map(o => [o, on.includes(o)]);
}
function champParCle(k) { for (const s of DOC_SECTIONS) { const c = s.champs.find(x => x.k === k); if (c) return c; } return null; }
function blocChecks(r, k, titre) {
  const c = champParCle(k); if (!c) return [];
  const out = titre ? [{ k: 'h3', t: titre }] : [];
  return out.concat([{ k: 'chk', items: chkItems(c, r) }]);
}
function lieu(r) { return [dtx(r, 'adresse', ''), [dtx(r, 'cp', ''), dtx(r, 'ville', '')].filter(Boolean).join(' ')].filter(Boolean).join(' — ') || '—'; }

/* Lignes d'analyse des risques issues de la sélection type/phases. */
function arLignes(r) {
  const sel = Array.isArray(r.ppsps_ar) ? r.ppsps_ar : [];
  const out = [];
  sel.forEach(s => RL.lignes(s.t, s.p).forEach(l => out.push(Object.assign({ type: RISQ_LIB.t[s.t] }, l))));
  return out;
}

/* ---- 11.5 Construction des documents ----------------------------------- */
function entete(r, titre) {
  return [
    { k: 'cover', t: titre },
    { k: 'p', t: dtx(r, 'chantier'), b: true, jc: 'center' },
    { k: 'p', t: lieu(r), jc: 'center' },
    { k: 'sp' },
    { k: 'kv', rows: [
      ['Client', dtx(r, 'client')],
      ['N° OTP', dtx(r, 'otp')],
      ['N° devis / affaire / contrat', dtx(r, 'affaire')],
      ['Lot n°', dtx(r, 'lot')],
      ['Début des travaux', dda(r, 'date_debut')],
      ['Fin prévisionnelle', dda(r, 'date_fin')],
      ["Délai d'exécution", dtx(r, 'delai')],
      ['Horaires de chantier', dtx(r, 'horaires')],
      ['Conducteur de travaux', dtx(r, 'conducteur') + (r.conducteur_tel ? ' — ' + r.conducteur_tel : '')],
      ['Responsable de chantier', dtx(r, 'resp_chantier') + (r.resp_chantier_tel ? ' — ' + r.resp_chantier_tel : '')],
      ['Rédacteur', dtx(r, 'redacteur') + (r.redacteur_fonction ? ' (' + r.redacteur_fonction + ')' : '')],
      ['Date de rédaction', dda(r, 'date_redac')],
    ]},
  ];
}
function tableauSign(titre, cols, rows, vides) {
  const head = cols.concat(['Signature']);
  const data = (rows || []).map(rw => cols.map((_, i) => rw[i] || '').concat(['']));
  for (let i = data.length; i < (vides || 0); i++) data.push(cols.map(() => '').concat(['']));
  return [{ k: 'h3', t: titre }, { k: 'tab', head, rows: data }];
}

/* ---- 11.6 État de l'assistant ------------------------------------------ */
let docsDossierId = '';           // dossier ouvert
let docsEtape = null;             // { doc, i } — position dans l'assistant
let docsInter = null;             // interstitiel de fin de section

const dossierById = id => DB.data.dossiers.find(d => d.id === id) || null;
function dossierCtx(dos) {
  const chantier = dos.chantierId ? DB.data.chantiers.find(c => c.id === dos.chantierId) : null;
  const client = chantier && chantier.clientId ? DB.data.clients.find(c => c.id === chantier.clientId) : null;
  return { chantier, client, profil: DB.currentProfile(), dossier: dos };
}
// Champs réellement à poser pour un document, dans l'ordre, en tenant compte des conditions.
function champsActifs(doc, rep) {
  const out = [];
  SECTIONS_PAR_DOC(doc).forEach(s => s.champs.forEach(c => { if (!c.si || c.si(rep)) out.push({ c, s }); }));
  return out;
}
function champRempli(c, rep) {
  const v = rep[c.k];
  if (v === undefined || v === null || v === '') return false;
  if (Array.isArray(v)) return v.length > 0 && (c.t !== 'liste' || dls(rep, c.k).length > 0);
  if (c.t === 'risques') return arLignesDe(v).length > 0;
  return true;
}
function arLignesDe(sel) {
  if (!Array.isArray(sel)) return [];
  let n = [];
  sel.forEach(s => { n = n.concat(RL.lignes(s.t, s.p)); });
  return n;
}
function progressionDoc(dos, doc) {
  const list = champsActifs(doc, dos.rep);
  const req = list.filter(x => x.c.req);
  const done = list.filter(x => champRempli(x.c, dos.rep)).length;
  const reqDone = req.filter(x => champRempli(x.c, dos.rep)).length;
  return { total: list.length, done, pct: list.length ? Math.round(done / list.length * 100) : 0, req: req.length, reqDone, complet: req.length > 0 && reqDone === req.length };
}
// Le tronc commun conditionne les autres documents : on l'affiche toujours en premier.
function progressionGlobale(dos) {
  const p = DOCS_ORDRE.map(d => progressionDoc(dos, d));
  const tot = p.reduce((a, x) => a + x.total, 0), done = p.reduce((a, x) => a + x.done, 0);
  return { pct: tot ? Math.round(done / tot * 100) : 0, done, tot };
}

/* ---- 11.8 Assistant de remplissage ------------------------------------- */
function ouvrirAssistant(dossierId, doc) {
  const dos = dossierById(dossierId); if (!dos) return;
  docsDossierId = dossierId;
  const list = champsActifs(doc, dos.rep);
  // Reprise : on se pose sur la première question sans réponse.
  let i = list.findIndex(x => !champRempli(x.c, dos.rep));
  if (i < 0) i = Math.max(0, list.length - 1);
  docsEtape = { doc, i }; docsInter = null;
  go('docs');
}
function fermerAssistant() { docsEtape = null; docsInter = null; go('docs'); }

function renderAssistant(v) {
  const dos = dossierById(docsDossierId);
  if (!dos) { docsEtape = null; return renderDocs(v); }
  const { doc } = docsEtape, meta = DOCS_META[doc];
  const list = champsActifs(doc, dos.rep);
  const p = progressionDoc(dos, doc);
  const sections = [...new Set(list.map(x => x.s.id))].map(id => list.find(x => x.s.id === id).s);

  const rail = sections.map(s => {
    const ch = list.filter(x => x.s.id === s.id);
    const ok = ch.every(x => champRempli(x.c, dos.rep));
    const cur = !docsInter && list[docsEtape.i] && list[docsEtape.i].s.id === s.id;
    const first = list.findIndex(x => x.s.id === s.id);
    return `<button class="wz-sec ${cur ? 'active' : ''} ${ok ? 'ok' : ''}" data-goto="${first}">
      <span class="wz-dot">${ok ? '✓' : ''}</span><span>${esc(s.t)}</span></button>`;
  }).join('');

  v.innerHTML = `
    <div class="wz">
      <aside class="wz-rail">
        <button class="btn small" id="wz-back">${icon('chevron', 'ic-sm')} Tous les documents</button>
        <div class="wz-doc ${meta.couleur}">${icon(meta.ico)}<div><b>${esc(meta.court)}</b><em>${esc(dos.nom)}</em></div></div>
        <div class="wz-prog"><i style="width:${p.pct}%"></i></div>
        <div class="t-muted" style="font-size:12px;margin:-4px 0 10px">${p.done}/${p.total} question(s) · ${p.reqDone}/${p.req} obligatoire(s)</div>
        <div class="wz-secs">${rail}</div>
        <div class="wz-docs">${DOCS_ORDRE.map(d2 => { const q = progressionDoc(dos, d2); return `<button class="wz-jump ${d2 === doc ? 'active' : ''}" data-doc="${d2}">${icon(DOCS_META[d2].ico, 'ic-sm')} <span>${esc(DOCS_META[d2].court)}</span><b>${q.pct}%</b></button>`; }).join('')}</div>
      </aside>
      <section class="wz-main" id="wz-main"></section>
    </div>`;
  $('#wz-back').onclick = fermerAssistant;
  $$('[data-goto]', v).forEach(b => b.onclick = () => { docsInter = null; docsEtape.i = +b.dataset.goto; renderAssistant(v); });
  $$('[data-doc]', v).forEach(b => b.onclick = () => ouvrirAssistant(dos.id, b.dataset.doc));
  renderEtape(v, dos, list);
}

function renderEtape(v, dos, list) {
  const main = $('#wz-main'), doc = docsEtape.doc;
  // --- Interstitiel de fin de section / de document ---
  if (docsInter) {
    if (docsInter.fin) {
      const p = progressionDoc(dos, doc);
      main.innerHTML = `<div class="wz-card wz-end">
        <div class="wz-end-ico ${DOCS_META[doc].couleur}">${icon('check')}</div>
        <h2>${esc(DOCS_META[doc].label)}</h2>
        <p class="t-muted">${p.done} question(s) renseignée(s) sur ${p.total}.${p.req - p.reqDone > 0 ? ` <b>${p.req - p.reqDone} question(s) obligatoire(s)</b> restent sans réponse.` : ' Toutes les questions obligatoires sont renseignées.'}</p>
        <div class="wz-end-acts">
          ${doc === 'commun' ? '' : `<button class="btn primary" id="e-prev">${icon('file')} Aperçu et export Word</button>`}
          <button class="btn" id="e-rev">${icon('edit')} Revoir les réponses</button>
          ${prochainDoc(doc) ? `<button class="btn ${doc === 'commun' ? 'primary' : ''}" id="e-next">Passer au ${esc(DOCS_META[prochainDoc(doc)].court)} ${icon('chevron')}</button>` : ''}
          <button class="btn" id="e-close">Terminer</button>
        </div></div>`;
      const pb = $('#e-prev'); if (pb) pb.onclick = () => apercuDoc(dos.id, doc);
      $('#e-rev').onclick = () => { docsInter = null; docsEtape.i = 0; renderAssistant(v); };
      const nb = $('#e-next'); if (nb) nb.onclick = () => ouvrirAssistant(dos.id, prochainDoc(doc));
      $('#e-close').onclick = fermerAssistant;
      return;
    }
    const suiv = list[docsInter.next];
    main.innerHTML = `<div class="wz-card wz-inter">
      <div class="wz-inter-ok">${icon('check')} Section terminée</div>
      <h2>${esc(docsInter.from)}</h2>
      <p class="t-muted">Section suivante</p>
      <div class="wz-inter-next">${esc(suiv.s.t)}</div>
      ${suiv.s.sub ? `<p class="t-muted" style="max-width:560px;margin:10px auto 0">${esc(suiv.s.sub)}</p>` : ''}
      <div class="wz-end-acts"><button class="btn primary" id="i-go">Continuer ${icon('chevron')}</button></div></div>`;
    $('#i-go').onclick = () => { docsEtape.i = docsInter.next; docsInter = null; renderAssistant(v); };
    return;
  }
  if (!list.length) { main.innerHTML = `<div class="wz-card"><p>Aucune question pour ce document.</p></div>`; return; }
  docsEtape.i = Math.max(0, Math.min(docsEtape.i, list.length - 1));
  const { c, s } = list[docsEtape.i];
  const ctx = dossierCtx(dos);
  let val = dos.rep[c.k];
  if ((val === undefined || val === '') && c.pre) { try { val = c.pre(ctx); } catch { val = undefined; } }

  main.innerHTML = `<div class="wz-card">
    <div class="wz-kicker">${esc(s.t)} <span>·</span> question ${docsEtape.i + 1} sur ${list.length}</div>
    <h2 class="wz-q">${esc(c.l)}${c.req ? '<b class="wz-req">obligatoire</b>' : ''}</h2>
    ${c.aide ? `<p class="wz-aide">${icon('alert', 'ic-sm')} ${esc(c.aide)}</p>` : ''}
    <div class="wz-input" id="wz-in">${champInput(c, val, dos)}</div>
    <div class="wz-nav">
      <button class="btn" id="w-prev" ${docsEtape.i === 0 ? 'disabled' : ''}>${icon('chevron', 'ic-sm')} Précédent</button>
      <span class="spacer"></span>
      <button class="btn" id="w-skip">Passer</button>
      <button class="btn primary" id="w-next">${docsEtape.i === list.length - 1 ? 'Terminer' : 'Valider et continuer'} ${icon('chevron', 'ic-sm')}</button>
    </div></div>`;

  const enregistrer = () => { dos.rep[c.k] = lireChamp(c); dos.maj = todayISO(); DB.save(); };
  const avancer = () => {
    enregistrer();
    // La liste peut changer : une réponse peut ouvrir ou fermer des questions conditionnelles.
    const nl = champsActifs(doc, dos.rep);
    const pos = nl.findIndex(x => x.c.k === c.k);
    const next = pos + 1;
    if (next >= nl.length) { docsInter = { fin: true }; renderAssistant(v); return; }
    if (nl[next].s.id !== s.id) { docsInter = { from: s.t, next }; renderAssistant(v); return; }
    docsEtape.i = next; renderAssistant(v);
  };
  $('#w-next').onclick = avancer;
  $('#w-skip').onclick = () => { const nl = champsActifs(doc, dos.rep); const pos = nl.findIndex(x => x.c.k === c.k); if (pos + 1 >= nl.length) { docsInter = { fin: true }; } else if (nl[pos + 1].s.id !== s.id) { docsInter = { from: s.t, next: pos + 1 }; } else { docsEtape.i = pos + 1; } renderAssistant(v); };
  $('#w-prev').onclick = () => { enregistrer(); docsEtape.i = Math.max(0, docsEtape.i - 1); renderAssistant(v); };
  cablerChamp(c, avancer, dos, v);
  const f = main.querySelector('input,textarea,select'); if (f && c.t !== 'oui') setTimeout(() => f.focus(), 30);
}
function prochainDoc(doc) { const i = DOCS_ORDRE.indexOf(doc); return i >= 0 && i < DOCS_ORDRE.length - 1 ? DOCS_ORDRE[i + 1] : null; }

/* ---- 11.9 Rendu et lecture d'un champ ---------------------------------- */
function champInput(c, val, dos) {
  const V = val === undefined || val === null ? '' : val;
  switch (c.t) {
    case 'area': return `<textarea id="f" rows="5" placeholder="${esc(c.ph || '')}">${esc(V)}</textarea>`;
    case 'date': return `<input id="f" type="date" value="${esc(V)}">`;
    case 'num': return `<div class="wz-unit"><input id="f" type="number" min="0" step="any" value="${esc(V)}">${c.unit ? `<span>${esc(c.unit)}</span>` : ''}</div>`;
    case 'tel': return `<input id="f" type="tel" value="${esc(V)}" placeholder="${esc(c.ph || '06 00 00 00 00')}">`;
    case 'mail': return `<input id="f" type="email" value="${esc(V)}" placeholder="${esc(c.ph || 'prenom.nom@smac-sa.com')}">`;
    case 'select': return `<select id="f"><option value="">— Choisir —</option>${(c.opts || []).map(o => `<option ${V === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    case 'oui': return `<div class="wz-choices">${(c.opts || OUI_NON).map(o => `<button class="wz-choice ${V === o ? 'on' : ''}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    case 'checks': {
      const on = Array.isArray(V) ? V : [];
      return `<div class="wz-checks">${(c.opts || []).map((o, i) => `<label class="wz-check ${on.includes(o) ? 'on' : ''}"><input type="checkbox" data-c="${i}" value="${esc(o)}" ${on.includes(o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>`;
    }
    case 'liste': {
      const rows = Array.isArray(V) && V.length ? V : [(c.cols || []).map(() => '')];
      return `<div class="wz-liste"><table><thead><tr>${(c.cols || []).map(h => `<th>${esc(h)}</th>`).join('')}<th></th></tr></thead>
        <tbody id="f-rows">${rows.map(r => ligneListe(c, r)).join('')}</tbody></table>
        <button class="btn small" id="f-add">${icon('plus', 'ic-sm')} Ajouter une ligne</button></div>`;
    }
    case 'risques': return champRisques(Array.isArray(V) ? V : []);
    default: return `<input id="f" type="text" value="${esc(V)}" placeholder="${esc(c.ph || '')}">`;
  }
}
function ligneListe(c, r) {
  return `<tr>${(c.cols || []).map((_, i) => `<td><input value="${esc((r && r[i]) || '')}"></td>`).join('')}<td class="actions-cell"><button class="icon-btn danger" data-rm>${icon('trash', 'ic-sm')}</button></td></tr>`;
}
function champRisques(sel) {
  const chosen = new Map(sel.map(s => [s.t, s.p]));
  const lignes = arLignesDe(sel);
  return `<div class="wz-risq">
    <div class="field"><label>Ajouter un type de travaux</label>
      <select id="rq-type"><option value="">— Choisir un type de travaux —</option>${RL.types().map(t => `<option value="${t.i}" ${chosen.has(t.i) ? 'disabled' : ''}>${esc(t.nom)}</option>`).join('')}</select></div>
    <div id="rq-sel">${sel.map(s => {
      const phases = RL.phases(s.t), on = new Set(s.p);
      return `<div class="rq-block" data-t="${s.t}">
        <div class="rq-head"><b>${esc(RISQ_LIB.t[s.t])}</b><span class="chip">${RL.lignes(s.t, s.p).length} ligne(s)</span><span class="spacer"></span>
          <button class="btn small" data-all="${s.t}">Tout cocher</button>
          <button class="icon-btn danger" data-rmt="${s.t}">${icon('trash', 'ic-sm')}</button></div>
        <div class="rq-phases">${phases.map(p => `<label class="wz-check small ${on.has(p.i) ? 'on' : ''}"><input type="checkbox" data-p="${p.i}" ${on.has(p.i) ? 'checked' : ''}><span>${esc(p.nom)}</span></label>`).join('')}</div>
      </div>`;
    }).join('')}</div>
    <div class="rq-total">${lignes.length ? `<b>${lignes.length}</b> ligne(s) d'analyse des risques seront générées dans le PPSPS.` : "Choisissez un type de travaux puis les phases concernées."}</div>
  </div>`;
}
let _lireChamp = null;   // fermeture posée par cablerChamp pour les champs composés
function lireChamp(c) {
  if (_lireChamp) return _lireChamp();
  const f = document.getElementById('f');
  if (!f) return undefined;
  if (c.t === 'num') { const n = parseFloat(f.value); return isNaN(n) ? '' : n; }
  return f.value.trim();
}
function cablerChamp(c, avancer, dos, v) {
  _lireChamp = null;
  const box = document.getElementById('wz-in');
  if (c.t === 'oui') {
    _lireChamp = () => { const b = box.querySelector('.wz-choice.on'); return b ? b.dataset.val : ''; };
    $$('.wz-choice', box).forEach(b => b.onclick = () => {
      $$('.wz-choice', box).forEach(x => x.classList.remove('on'));
      b.classList.add('on'); avancer();               // réponse fermée : on enchaîne
    });
    return;
  }
  if (c.t === 'checks') {
    _lireChamp = () => $$('input[type=checkbox]', box).filter(i => i.checked).map(i => i.value);
    $$('.wz-check', box).forEach(l => l.querySelector('input').onchange = e => l.classList.toggle('on', e.target.checked));
    return;
  }
  if (c.t === 'liste') {
    const cols = (c.cols || []).length;
    _lireChamp = () => $$('#f-rows tr', box).map(tr => $$('input', tr).map(i => i.value.trim())).filter(r => r.some(x => x));
    const armer = () => $$('[data-rm]', box).forEach(b => b.onclick = () => { const tb = document.getElementById('f-rows'); b.closest('tr').remove(); if (!tb.children.length) { tb.insertAdjacentHTML('beforeend', ligneListe(c, [])); armer(); } });
    armer();
    document.getElementById('f-add').onclick = () => { document.getElementById('f-rows').insertAdjacentHTML('beforeend', ligneListe(c, [])); armer(); const rows = $$('#f-rows tr', box); const last = rows[rows.length - 1].querySelector('input'); if (last) last.focus(); };
    return;
  }
  if (c.t === 'risques') {
    const lire = () => $$('.rq-block', box).map(bl => ({ t: +bl.dataset.t, p: $$('input[data-p]', bl).filter(i => i.checked).map(i => +i.dataset.p) })).filter(s => s.p.length);
    _lireChamp = lire;
    const rafraichir = () => { dos.rep[c.k] = lire(); DB.save(); renderAssistant(v); };
    const sel = document.getElementById('rq-type');
    sel.onchange = () => {
      if (!sel.value) return;
      const cur = lire(); cur.push({ t: +sel.value, p: RL.phases(+sel.value).map(p => p.i) });
      dos.rep[c.k] = cur; DB.save(); renderAssistant(v);
    };
    $$('[data-rmt]', box).forEach(b => b.onclick = () => { dos.rep[c.k] = lire().filter(s => s.t !== +b.dataset.rmt); DB.save(); renderAssistant(v); });
    $$('[data-all]', box).forEach(b => b.onclick = () => { const bl = b.closest('.rq-block'); $$('input[data-p]', bl).forEach(i => { i.checked = true; i.closest('label').classList.add('on'); }); rafraichir(); });
    $$('input[data-p]', box).forEach(i => i.onchange = () => { i.closest('label').classList.toggle('on', i.checked); const cur = lire(); dos.rep[c.k] = cur; DB.save(); const tot = arLignesDe(cur).length; const t = box.querySelector('.rq-total'); if (t) t.innerHTML = tot ? `<b>${tot}</b> ligne(s) d'analyse des risques seront générées dans le PPSPS.` : "Choisissez un type de travaux puis les phases concernées."; });
    return;
  }
  // Champs simples : Entrée valide (Ctrl+Entrée pour les zones de texte).
  const f = document.getElementById('f');
  if (f) f.onkeydown = e => {
    if (e.key !== 'Enter') return;
    if (c.t === 'area' && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault(); avancer();
  };
}

/* ---- 11.10 Aperçu et export -------------------------------------------- */
function apercuDoc(dossierId, doc) {
  const dos = dossierById(dossierId); if (!dos || !DOC_BUILD[doc]) return;
  const blocks = DOC_BUILD[doc](dos.rep);
  const p = progressionDoc(dos, doc);
  const m = modal({ title: DOCS_META[doc].label, xwide: true,
    body: `<div class="doc-prev-bar">
        <span class="chip ${p.complet ? 'ok' : 'warn'}">${p.complet ? 'Questions obligatoires complètes' : (p.req - p.reqDone) + ' question(s) obligatoire(s) sans réponse'}</span>
        <span class="t-muted">${p.done}/${p.total} renseignées</span>
      </div>
      <div class="doc-prev" id="doc-prev">${blocsHtml(blocks)}</div>`,
    footer: `<button class="btn" data-c>Fermer</button>
      <button class="btn" id="p-edit">${icon('edit')} Compléter</button>
      <button class="btn" id="p-print">${icon('file')} Imprimer / PDF</button>
      <button class="btn primary" id="p-word">${icon('download')} Export Word (.docx)</button>` });
  m.root.querySelector('[data-c]').onclick = m.close;
  $('#p-edit').onclick = () => { m.close(); ouvrirAssistant(dossierId, doc); };
  $('#p-word').onclick = () => {
    const nom = (DOCS_META[doc].court + '_' + (dos.rep.otp || dos.nom || 'chantier')).replace(/[^\w\-]+/g, '_');
    writeDocx(nom + '.docx', blocks, DOCS_META[doc].label);
    toast('Document Word généré');
  };
  $('#p-print').onclick = () => imprimerDoc(DOCS_META[doc].label, blocks);
}
function imprimerDoc(titre, blocks) {
  const w = window.open('', '_blank');
  if (!w) { toast("Autorisez les fenêtres pop-up pour imprimer", 'err'); return; }
  const css = `body{font:12px/1.5 'Segoe UI',system-ui,sans-serif;color:#111c2e;margin:18mm 14mm}
    .dc-cover{text-align:center;font-size:22px;font-weight:700;color:#1b4f8a;margin:0 0 14px;white-space:pre-line}
    .dc-h1{font-size:16px;color:#1b4f8a;border-bottom:2px solid #1b4f8a;padding-bottom:4px;margin:20px 0 10px;page-break-after:avoid}
    .dc-h2{font-size:14px;color:#1b4f8a;margin:16px 0 6px;page-break-after:avoid}
    .dc-h3{font-size:12.5px;margin:12px 0 4px;page-break-after:avoid}
    .dc-p{margin:6px 0}.dc-note{margin:6px 0;font-style:italic;color:#5a6b80}
    .dc-ul,.dc-chk{margin:6px 0;padding-left:18px}.dc-chk{list-style:none;padding-left:4px}
    .dc-chk li.on{font-weight:600}
    table.dc-tab{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px;page-break-inside:auto}
    .dc-tab th,.dc-tab td{border:1px solid #9aa7b8;padding:4px 6px;text-align:left;vertical-align:top}
    .dc-tab thead th{background:#e7edf5}.dc-tab.kv th{width:30%;background:#f4f7fa}
    .dc-tab tr{page-break-inside:avoid}
    .dc-pb{page-break-after:always}
    @page{size:A4;margin:14mm}`;
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(titre)}</title><style>${css}</style></head><body>${blocsHtml(blocks)}</body></html>`);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 300);
}

/* -------------------------------------------------------------------------
   10. Boot
   ------------------------------------------------------------------------- */
function boot() {
  UI.load();
  $('#brand-mark').innerHTML = icon('layers');
  $('#menu-toggle').innerHTML = icon('menu');
  $('#nav-collapse').innerHTML = icon('menu');
  $('#nav-collapse').onclick = () => UI.toggleNav();
  $('#btn-export').innerHTML = icon('download', 'ic-sm') + '<span>Sauvegarde</span>';
  $('#btn-import').innerHTML = icon('upload', 'ic-sm') + '<span>Restaurer</span>';
  buildNav();
  $('#year-badge').textContent = 'Année ' + new Date().getFullYear();
  $('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');
  $('#profile-btn').onclick = e => { e.stopPropagation(); toggleProfileMenu(); };
  $('#btn-export').onclick = exportAll;
  $('#btn-import').onclick = () => $('#import-file').click();
  $('#import-file').onchange = e => { if (e.target.files[0]) importAll(e.target.files[0]); e.target.value = ''; };
  // Double-clic sur une ligne = ouvrir/éditer l'élément (plus intuitif)
  $('#view').addEventListener('dblclick', e => {
    if (e.target.closest('input,select,textarea,button,a,.link,label')) return;
    const tr = e.target.closest('tbody tr'); if (!tr) return;
    const btn = tr.querySelector('[data-edit],[data-editv],[data-open],[data-view]');
    if (btn) { const sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges(); btn.click(); }
  });
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== current) go(r); });
  // Les vues se redessinent seules (filtres, onglets…) : on réarme les poignées à chaque rendu.
  new MutationObserver(scheduleCols).observe($('#view'), { childList: true, subtree: true });

  DB.loadMeta();
  if (!DB.meta.profiles.length) { renderProfileButton(); firstRun(); return; }
  if (!DB.currentProfile()) DB.meta.currentId = DB.meta.profiles[0].id;
  DB.loadProfile(DB.meta.currentId);
  renderProfileButton();
  go(location.hash.slice(1) || 'dashboard');
}
boot();
