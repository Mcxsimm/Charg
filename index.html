<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargéPro — Assistant Chargé d'Affaires</title>
  <meta name="description" content="Outil de pilotage pour chargé d'affaires étanchéité : chantiers, devis, CA & marge, BTE, cadences.">
  <style>
:root{
  --bg:#0e1b2b; --bg2:#13233a;
  --panel:#ffffff; --panel-2:#f6f8fb; --panel-3:#eef2f7;
  --ink:#111c2e; --ink-soft:#48566b; --muted:#8b98ab; --line:#e3e9f0;
  --brand:#1b4f8a; --brand-2:#2568b3; --brand-ink:#e9f1fa; --brand-soft:#f0f6fc;
  --green:#1f7a4d; --green-bg:#e6f4ec;
  --red:#b3261e; --red-bg:#fbeae9;
  --amber:#9a6700; --amber-bg:#fdf3dd;
  --violet:#5b3fb0; --violet-bg:#efeafb;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,30,54,.06),0 4px 16px rgba(16,30,54,.05);
  --shadow-lg:0 20px 48px rgba(16,30,54,.22);
  --sidebar-w:246px;
  --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--panel-2);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px}
h1,h2,h3{margin:0}

.ic{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}

#app{display:flex;min-height:100vh}

/* ---------------- Sidebar ---------------- */
#sidebar{width:var(--sidebar-w);background:var(--bg);color:#aebacb;display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;height:100vh;z-index:40;border-right:1px solid #0a1420}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brand-2),var(--brand));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand-mark .ic{width:20px;height:20px}
.brand-name{font-weight:700;font-size:16px;color:#fff;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:#6f8199;letter-spacing:.3px;text-transform:uppercase}
#nav{display:flex;flex-direction:column;gap:1px;padding:10px 12px;flex:1;overflow:auto}
.nav-group{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:#5c6f88;font-weight:700;padding:12px 12px 5px}
.nav-group:first-child{padding-top:4px}
.nav-item{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#aebacb;
  padding:10px 12px;border-radius:8px;text-align:left;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;width:100%}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item.active .ic{color:#fff}
.nav-item .ic{color:#8697ad}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:8px}
.foot-row{display:flex;gap:8px}
.mini-btn{flex:1;background:rgba(255,255,255,.05);color:#b7c3d4;border:1px solid rgba(255,255,255,.09);
  border-radius:7px;padding:8px 6px;font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.mini-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.foot-note{font-size:10px;color:#5c6f88;text-align:center;line-height:1.4}

/* ---------------- Main ---------------- */
#main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;height:60px}
#menu-toggle{display:none;background:none;border:0;color:var(--ink);padding:6px}
#page-title{font-size:18px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.year-badge{color:var(--ink-soft);font-weight:600;font-size:12.5px}

/* Profile switcher */
.profile-btn{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:6px 10px 6px 8px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.profile-btn:hover{border-color:var(--brand-2)}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--brand-ink);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.profile-btn .p-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-btn .ic{color:var(--muted)}
.menu{position:absolute;top:54px;right:26px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);width:280px;z-index:50;overflow:hidden;animation:pop .14s ease}
.menu-head{padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;font-weight:500;width:100%;background:none;border:0;text-align:left}
.menu-item:hover{background:var(--panel-2)}
.menu-item.active{color:var(--brand);font-weight:600}
.menu-item .ic{color:var(--muted)}
.menu-item.active .ic{color:var(--brand)}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.menu-item.danger{color:var(--red)} .menu-item.danger .ic{color:var(--red)}

#view{padding:24px 26px 64px;max-width:1260px;width:100%}

/* ---------------- Buttons ---------------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;
  font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--brand-2);color:var(--brand)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);color:#fff}
.btn.primary .ic{color:#fff}
.btn.danger{color:var(--red);border-color:#f0cbc8}
.btn.danger:hover{background:var(--red-bg)}
.btn.small{padding:6px 10px;font-size:12px}
.icon-btn{border:1px solid transparent;background:transparent;padding:6px;border-radius:7px;color:var(--ink-soft);display:inline-flex}
.icon-btn:hover{background:var(--panel-3);color:var(--ink)}
.icon-btn.danger:hover{background:var(--red-bg);color:var(--red)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:0 0 14px}
.section-head{display:flex;align-items:center;gap:9px;margin:2px 0 14px}
.section-head .ic{color:var(--brand-2)}
.section-head h2{font-size:15px;font-weight:700}
.spacer{flex:1}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:15px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-ico{width:32px;height:32px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.kpi-ico.green{background:var(--green-bg);color:var(--green)}
.kpi-ico.amber{background:var(--amber-bg);color:var(--amber)}
.kpi-ico.red{background:var(--red-bg);color:var(--red)}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:3px}
.progress{height:6px;border-radius:99px;background:var(--panel-3);margin-top:12px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--brand-2);transition:width .4s}
.progress.green>i{background:var(--green)} .progress.amber>i{background:var(--amber)} .progress.red>i{background:var(--red)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
thead th{background:var(--panel-2);text-align:left;padding:11px 14px;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);font-weight:700}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{padding:11px 14px;font-weight:700;background:var(--panel-2);border-top:2px solid var(--line);font-variant-numeric:tabular-nums}
.t-strong{font-weight:700}.t-muted{color:var(--muted)}
.link{color:var(--brand);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.actions-cell{text-align:right;white-space:nowrap}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.5}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.b-prospect{background:var(--panel-3);color:var(--ink-soft)}
.b-devis,.b-envoye{background:var(--brand-ink);color:var(--brand)}
.b-relance,.b-encours,.b-attente-alt{background:var(--amber-bg);color:var(--amber)}
.b-attente{background:var(--panel-3);color:var(--ink-soft)}
.b-commande{background:var(--violet-bg);color:var(--violet)}
.b-receptionne,.b-facture,.b-accepte{background:var(--green-bg);color:var(--green)}
.b-perdu,.b-refuse{background:var(--red-bg);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-3);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.chip .ic{width:14px;height:14px;color:var(--muted)}
.deadline-ok{color:var(--green);font-weight:700}
.deadline-soon{color:var(--amber);font-weight:700}
.deadline-late{color:var(--red);font-weight:700}
.margin-good{color:var(--green);font-weight:700}
.margin-warn{color:var(--amber);font-weight:700}
.margin-bad{color:var(--red);font-weight:700}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(37,104,179,.14)}
.field .hint{font-size:11px;color:var(--muted)}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.field.inline input{width:auto}

/* Modal */
#modal-root:empty,#menu-root:empty{display:none}
.modal-back{position:fixed;inset:0;background:rgba(14,27,43,.55);backdrop-filter:blur(2px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:600px;box-shadow:var(--shadow-lg);animation:pop .16s ease}
.modal.wide{max-width:940px}
.modal.xwide{max-width:min(1320px,96vw)}
.modal.xwide .modal-body{max-height:84vh}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px}
.modal-head .icon-btn{margin-left:auto}
.modal-body{padding:20px 22px;max-height:72vh;overflow:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line)}

/* Toast */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:#111c2e;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;animation:pop .18s ease;max-width:340px;display:flex;align-items:center;gap:9px}
.toast .ic{width:16px;height:16px}
.toast.ok{background:#155e39}.toast.err{background:#8f1f18}

/* Empty */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .em-ico{width:52px;height:52px;border-radius:12px;background:var(--panel-3);color:var(--muted);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .em-ico .ic{width:26px;height:26px}
.empty h3{color:var(--ink-soft);margin-bottom:6px;font-size:15px}

/* Layout helpers */
.page-actions{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-line:last-child{border-bottom:0}
.stat-line b{font-variant-numeric:tabular-nums}
.pill-tabs{display:inline-flex;gap:4px;background:var(--panel-3);padding:4px;border-radius:9px;margin-bottom:16px}
.pill-tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-soft)}
.pill-tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap .ic{position:absolute;left:10px;color:var(--muted);width:16px;height:16px;pointer-events:none}
.search-wrap input{padding-left:32px;min-width:240px}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px}
.alert .a-ico{flex:none;color:var(--muted)}
.alert.warn{border-color:#f0dca6;background:var(--amber-bg)} .alert.warn .a-ico{color:var(--amber)}
.alert.bad{border-color:#eec4c1;background:var(--red-bg)} .alert.bad .a-ico{color:var(--red)}
.alert .a-body{min-width:0}
.alert .a-act{margin-left:auto}

/* Bars */
.barchart{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:8px}
.barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barchart .bar{width:44%;background:var(--brand-2);border-radius:3px 3px 0 0;min-height:2px;transition:height .4s}
.barchart .bar.margin{background:var(--green)}
.barchart .bars{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.barchart .bar-lbl{font-size:10px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Cadences result */
.cad-out .grid-3{margin-bottom:0}
.cad-metric{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius);padding:16px 18px;background:#fff;box-shadow:var(--shadow)}
.cad-metric.green{border-left-color:var(--green)}
.cad-metric.amber{border-left-color:var(--amber)}
.cad-metric .cm-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:600}
.cad-metric .cm-value{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.cad-metric .cm-sub{font-size:12px;color:var(--muted)}
.cad-steps td{white-space:normal}

/* Calendar */
.cal-wrap{overflow-x:auto}
.cal-inner{min-width:720px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{margin-bottom:6px}
.cal-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:4px 6px}
.cal-cell{min-height:104px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 6px;cursor:pointer;overflow:hidden;transition:border-color .12s}
.cal-cell:hover{border-color:var(--brand-2)}
.cal-cell.out{background:var(--panel-2)}
.cal-cell.out .cal-daynum{color:var(--muted)}
.cal-cell.today{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.cal-daynum{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
.cal-ev{display:block;font-size:10.5px;font-weight:600;color:#fff;border-radius:4px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-more{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}

/* Pointages grid */
.point-grid th,.point-grid td{vertical-align:top}
.point-grid thead th{text-align:center}
.point-grid thead th:first-child{text-align:left}
.pcell-td{padding:6px 6px}
.pcell{display:flex;flex-direction:column;gap:4px;min-width:96px}
.pcell .ph{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
.pcell .po{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 4px;font-size:11.5px;background:#fff;max-width:120px}
.pcell .ph:focus,.pcell .po:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 2px rgba(37,104,179,.14)}
.point-grid .rowtot,.point-grid .coltot{font-weight:700}

/* BTE façon feuille Excel */
.xls{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;table-layout:fixed}
.xls td{border:1px solid #d5dce6;padding:0;height:27px;overflow:hidden;text-overflow:ellipsis}
.xls input{border:0;background:transparent;width:100%;height:25px;padding:0 8px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.xls td.num{text-align:right}
.xls td.num input{text-align:right;font-variant-numeric:tabular-nums}
.xls input:focus{outline:2px solid var(--brand-2);outline-offset:-2px;background:#fff;border-radius:2px}
.xls .xls-inline{display:inline-block;width:80px}
.xls .xls-lbl{font-weight:700;text-align:right;padding:0 10px;background:#f6f8fb;white-space:nowrap}
.xls .xls-val{font-weight:800;padding:0 10px;font-variant-numeric:tabular-nums}
.xls .xls-bte{font-weight:800;text-align:center;font-size:15px;letter-spacing:3px;color:var(--brand);background:#f6f8fb}
.xls .xls-head td{background:#fff}
.xls .xls-colhead td{background:var(--panel-3);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;padding:6px 8px;color:var(--ink-soft)}
.xls .bte-sec td{background:#e7eef7;font-weight:700;padding:5px 9px;color:var(--ink)}
.xls .bte-sub td{background:#f6f8fb;font-weight:700}
.xls .tot,.xls .sub{padding:0 8px;font-variant-numeric:tabular-nums}
.xls .xls-act{text-align:center}
.xls .xls-act .icon-btn{padding:3px}

/* Timesheet (saisie des pointages) */
.ts-person{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.ts-avatar{width:44px;height:44px;border-radius:10px;background:var(--brand-ink);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.ts-workersel{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:700;font-size:14px;width:100%;background:#fff}
.ts-prog{margin-top:8px}
.ts-prog-lbl{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.ts-grid td,.ts-grid th{padding:6px 8px}
.ts-grid thead th{text-align:center}
.ts-grid thead th:nth-child(-n+3){text-align:left}
.ts-grid input,.ts-grid select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12.5px;background:#fff}

const OBJECTIFS_DEFAUT = { caAnnuel: 750000, margeCible: 0.30, devisMois: 45, rdvMois: 4, delaiDevis: 7, delaiFacture: 7, delaiRapport: 7, delaiPaiement: 45, tauxHoraireMO: 45 };

/* -------------------------------------------------------------------------
   4. Store — multi-profils
   Méta : chargepro.v2.meta  { profiles:[{id,nom,agence}], currentId }
   Données par profil : chargepro.v2.data.<id>  (chargé à la demande)
   ------------------------------------------------------------------------- */
const META_KEY = 'chargepro.v2.meta';
const dataKey = id => 'chargepro.v2.data.' + id;

const DB = {
  meta: null,   // { profiles, currentId }
  data: null,   // données du profil courant

  loadMeta() {
    try { this.meta = JSON.parse(localStorage.getItem(META_KEY)); } catch { this.meta = null; }
    if (!this.meta || !Array.isArray(this.meta.profiles)) this.meta = { profiles: [], currentId: null };
    // migration éventuelle depuis l'ancienne version v1
    if (!this.meta.profiles.length) {
      let old = null; try { old = JSON.parse(localStorage.getItem('chargepro.v1')); } catch {}
      if (old) {
        const id = uid();
        this.meta = { profiles: [{ id, nom: 'Mon profil', agence: '' }], currentId: id };
        localStorage.setItem(dataKey(id), JSON.stringify(this.normalize(old)));
        localStorage.removeItem('chargepro.v1');
        this.saveMeta();
      }
    }
    return this.meta;
  },
  saveMeta() { localStorage.setItem(META_KEY, JSON.stringify(this.meta)); },

  normalize(d) {
    d = d || {};
    d.objectifs = Object.assign({}, OBJECTIFS_DEFAUT, d.objectifs || {});
    ['clients', 'chantiers', 'devis', 'ca', 'bte', 'prospection', 'factures', 'contrats', 'visites', 'equipes', 'pointages', 'commandes'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
    d.devis.forEach(x => { if (x.otp === undefined) x.otp = ''; if (x.clientId === undefined) x.clientId = ''; });
    d.factures.forEach(x => { if (x.otp === undefined) x.otp = ''; });
    d.ca.forEach(x => { if (x.sourceType === undefined) { x.sourceType = ''; x.sourceId = ''; } });
    d.commandes.forEach(x => { if (x.dateReception === undefined) x.dateReception = ''; if (x.num === undefined) x.num = ''; });
    d.chantiers.forEach(x => { if (x.sourceDevisId === undefined) x.sourceDevisId = ''; });
    if (!Array.isArray(d.agenda)) d.agenda = [];
    if (!Array.isArray(d.otps)) d.otps = [];
    d.pointages = migratePointages(d.pointages);
    d.bte = d.bte.map(migrateBte);
    return d;
  },
  emptyData() { return this.normalize({}); },

  loadProfile(id) {
    let d; try { d = JSON.parse(localStorage.getItem(dataKey(id))); } catch { d = null; }
    this.data = this.normalize(d || {});
    return this.data;
  },
  save() { if (this.currentProfile()) localStorage.setItem(dataKey(this.meta.currentId), JSON.stringify(this.data)); },

  currentProfile() { return this.meta.profiles.find(p => p.id === this.meta.currentId) || null; },
  createProfile(nom, agence, demo) {
    const id = uid();
    this.meta.profiles.push({ id, nom: nom || 'Nouveau profil', agence: agence || '' });
    this.meta.currentId = id;
    localStorage.setItem(dataKey(id), JSON.stringify(demo ? demoData() : this.emptyData()));
    this.saveMeta(); this.loadProfile(id);
    return id;
  },
  switchTo(id) { if (this.meta.profiles.some(p => p.id === id)) { this.meta.currentId = id; this.saveMeta(); this.loadProfile(id); } },
  renameProfile(id, nom, agence) { const p = this.meta.profiles.find(x => x.id === id); if (p) { p.nom = nom; p.agence = agence; this.saveMeta(); } },
  deleteProfile(id) {
    localStorage.removeItem(dataKey(id));
    this.meta.profiles = this.meta.profiles.filter(p => p.id !== id);
    if (this.meta.currentId === id) this.meta.currentId = this.meta.profiles[0] ? this.meta.profiles[0].id : null;
    this.saveMeta();
    if (this.meta.currentId) this.loadProfile(this.meta.currentId);
  },
};

/* Pointages : modèle en LIGNES hebdo (une ligne = imputation OTP d'un compagnon,
   heures par jour dans h[0..6]). Migration depuis l'ancien format journalier. */
function migratePointages(list) {
  if (!Array.isArray(list) || !list.length) return list || [];
  if (list[0].h) return list; // déjà en lignes
  const rows = {};
  list.forEach(p => {
    if (!p.jour) return;
    const sem = mondayISO(new Date(p.jour + 'T00:00:00'));
    const di = (new Date(p.jour + 'T00:00:00').getDay() + 6) % 7;
    const key = [p.workerKey, sem, p.otp || '', p.chantierNom || ''].join('|');
    if (!rows[key]) rows[key] = { id: uid(), workerKey: p.workerKey, workerNom: p.workerNom, equipeId: p.equipeId, semaine: sem, categorie: '3000111', typeHeure: 'HT', otp: p.otp || '', chantierNom: p.chantierNom || '', h: [0, 0, 0, 0, 0, 0, 0], panier: 0, trajet: 0, zone: '' };
    rows[key].h[di] += (+p.heures || 0);
  });
  return Object.values(rows);
}

/* -------------------------------------------------------------------------
   5. Toast / Modal / Confirm
   ------------------------------------------------------------------------- */
function toast(msg, kind = 'ok') {
  const ico = kind === 'err' ? 'alert' : 'check';
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.innerHTML = icon(ico) + '<span>' + esc(msg) + '</span>';
  $('#toast-root').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; t.style.transition = '.3s'; }, 2200);
  setTimeout(() => t.remove(), 2600);
}
function modal({ title, body, wide, xwide, footer }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-back"><div class="modal ${xwide ? 'xwide' : wide ? 'wide' : ''}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>${icon('x')}</button></div>
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  root.querySelector('[data-close]').onclick = close;
  root.querySelector('.modal-back').onclick = e => { if (e.target.classList.contains('modal-back')) close(); };
  return { root, close };
}
function confirmDialog(msg, onYes, label = 'Supprimer') {
  const m = modal({ title: 'Confirmation', body: `<p style="margin:0">${esc(msg)}</p>`,
    footer: `<button class="btn" data-no>Annuler</button><button class="btn danger" data-yes>${esc(label)}</button>` });
  m.root.querySelector('[data-no]').onclick = m.close;
  m.root.querySelector('[data-yes]').onclick = () => { m.close(); onYes(); };
}

/* =========================================================================
   8. VUES
   ========================================================================= */
function marge(r) { return (+r.prixVente || 0) - (+r.fournitures || 0) - (+r.engins || 0) - (+r.moSmac || 0); }
const sameMonth = iso => { if (!iso) return false; const d = new Date(iso + 'T00:00:00'), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); };

/* -- Finances / entretien : helpers partagés -- */
function factureEcheance(f) { return f.dateEmission ? addDays(f.dateEmission, +f.echeanceJours || DB.data.objectifs.delaiPaiement) : ''; }
function factureFlags(f) {
  const o = DB.data.objectifs, t = todayISO(), ech = factureEcheance(f);
  return { echeance: ech,
    retardEmission: f.statut === 'a_emettre' && f.dateFG && daysBetween(f.dateFG, t) > o.delaiFacture,
    retardPaiement: f.statut === 'emise' && ech && ech < t };
}
const contratActif = c => !c.dateFin || c.dateFin >= todayISO();
const contratVisitesFutures = c => DB.data.visites.filter(v => v.contratId === c.id && v.statut === 'planifiee' && v.datePrevue >= todayISO());
const contratAProgrammer = c => contratActif(c) && contratVisitesFutures(c).length === 0;
const rapportsEnRetard = () => DB.data.visites.filter(v => v.statut === 'realisee' && v.dateRealisee && !v.rapportDate && daysBetween(v.dateRealisee, todayISO()) > DB.data.objectifs.delaiRapport);
const rdvNouveauxMois = () => DB.data.prospection.filter(p => p.canal === 'rdv_nouveau' && sameMonth(p.date) && p.statut !== 'sans_suite').length;
const carnetCommandes = () => DB.data.chantiers.filter(c => ['commande', 'en_cours'].includes(c.statut)).reduce((s, c) => s + (+c.montantHT || 0), 0);

function collectActions() {
  const o = DB.data.objectifs, t = todayISO(), acts = [];
  DB.data.devis.filter(d => d.statut === 'attente').forEach(d => {
    const rest = o.delaiDevis - daysBetween(d.dateDemande, t);
    if (rest <= 2) acts.push({ tone: rest < 0 ? 'bad' : 'warn', ico: 'file', route: 'devis', urg: rest, title: `Devis à envoyer — ${d.objet || d.ref}`, badge: rest < 0 ? `Retard ${-rest} j` : rest === 0 ? "Aujourd'hui" : `${rest} j` });
  });
  DB.data.devis.filter(d => ['envoye', 'relance'].includes(d.statut) && d.relance && d.relance <= t).forEach(d => acts.push({ tone: 'warn', ico: 'bell', route: 'devis', urg: 0, title: `Relancer le devis — ${d.objet || d.ref}`, badge: `Relance ${fmtDate(d.relance)}` }));
  DB.data.factures.forEach(f => { const fl = factureFlags(f);
    if (fl.retardEmission) acts.push({ tone: 'bad', ico: 'receipt', route: 'factures', urg: -daysBetween(f.dateFG, t), title: `Facture à émettre — ${f.objet}`, badge: 'Retard émission' });
    if (fl.retardPaiement) acts.push({ tone: 'bad', ico: 'euro', route: 'factures', urg: -daysBetween(fl.echeance, t), title: `Impayé — ${f.client} · ${f.objet}`, badge: `Échéance ${fmtDate(fl.echeance)}` });
  });
  DB.data.contrats.filter(contratAProgrammer).forEach(c => acts.push({ tone: 'warn', ico: 'wrench', route: 'entretien', urg: 1, title: `Visite à programmer — ${esc(clientNom(c.clientId))} (${esc(c.nom)})`, badge: 'À programmer' }));
  rapportsEnRetard().forEach(vz => { const c = DB.data.contrats.find(x => x.id === vz.contratId); acts.push({ tone: 'bad', ico: 'file', route: 'entretien', urg: -daysBetween(vz.dateRealisee, t), title: `Rapport d'intervention en retard — ${c ? esc(clientNom(c.clientId)) : ''}`, badge: 'Sous 7 j' }); });
  DB.data.prospection.filter(p => p.prochaine && p.prochaine <= t && !['gagne', 'sans_suite'].includes(p.statut)).forEach(p => acts.push({ tone: 'warn', ico: 'phone', route: 'prospection', urg: 0, title: `Relance prospect — ${esc(p.nom)}`, badge: fmtDate(p.prochaine) }));
  return acts.sort((a, b) => a.urg - b.urg);
}

/* ---------- Tableau de bord ---------- */
function renderDashboard(v) {
  const o = DB.data.objectifs, now = new Date(), mo = now.getMonth(), yr = now.getFullYear();
  const caY = DB.data.ca.filter(r => r.annee === yr);
  const caAnnuel = caY.reduce((s, r) => s + (+r.prixVente || 0), 0);
  const caMarge = caY.reduce((s, r) => s + marge(r), 0);
  const margePct = caAnnuel ? caMarge / caAnnuel : 0;
  const devisMois = DB.data.devis.filter(d => { const ref = d.dateEnvoi || d.dateDemande; if (!ref) return false; const dd = new Date(ref + 'T00:00:00'); return dd.getMonth() === mo && dd.getFullYear() === yr; }).length;
  const caProg = Math.round(caAnnuel / (o.caAnnuel || 1) * 100);
  const rdvMois = rdvNouveauxMois();
  const carnet = carnetCommandes();
  const impayes = DB.data.factures.filter(f => f.statut === 'emise').reduce((s, f) => s + (+f.montantHT || 0), 0);
  const impRetard = DB.data.factures.filter(f => factureFlags(f).retardPaiement).length;
  const actions = collectActions();

  const kpi = (label, value, sub, ico, tone, prog, route) => {
    let bar = '';
    if (prog) { const p = Math.min(100, Math.round(prog.val / (prog.max || 1) * 100)); const cls = p >= 90 ? 'green' : p >= 50 ? '' : 'amber'; bar = `<div class="progress ${cls}"><i style="width:${p}%"></i></div>`; }
    return `<div class="kpi" ${route ? `data-goto="${route}" style="cursor:pointer"` : ''}><div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-ico ${tone || ''}">${icon(ico)}</span></div>
      <div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div>${bar}</div>`;
  };

  v.innerHTML = `
    <div class="kpi-grid">
      ${kpi('CA annuel réalisé', eur(caAnnuel), `Objectif ${eur(o.caAnnuel)} · ${caProg}%`, 'euro', '', { val: caAnnuel, max: o.caAnnuel }, 'ca')}
      ${kpi('Marge brute moyenne', pct(margePct), `Cible indicative ${pct(o.margeCible)}`, 'trend', 'green', { val: margePct, max: o.margeCible }, 'ca')}
      ${kpi('Carnet de commandes', eur(carnet), 'Commandes + chantiers en cours', 'book', '', null, 'chantiers')}
      ${kpi('Devis du mois', devisMois + ' / ' + o.devisMois, MOIS[mo] + ' ' + yr, 'file', '', { val: devisMois, max: o.devisMois }, 'devis')}
      ${kpi('RDV nouveaux clients', rdvMois + ' / ' + o.rdvMois, MOIS[mo] + ' — prospection', 'phone', rdvMois >= o.rdvMois ? 'green' : 'amber', { val: rdvMois, max: o.rdvMois }, 'prospection')}
      ${kpi('Encours facturé', eur(impayes), impRetard ? impRetard + ' facture(s) en retard' : 'À jour', 'receipt', impRetard ? 'red' : 'green', null, 'factures')}
    </div>
    <div class="grid-2">
      <div class="card card-pad">
        <div class="section-head">${icon('bell')}<h2>Actions prioritaires</h2>${actions.length ? `<span class="spacer"></span><span class="chip">${actions.length}</span>` : ''}</div>
        ${actions.length ? `<div class="alert-list">${actions.slice(0, 9).map(a => `<div class="alert ${a.tone}" data-goto="${a.route}" style="cursor:pointer">
          <span class="a-ico">${icon(a.ico)}</span><div class="a-body"><b>${a.title}</b></div>
          <span class="a-act badge ${a.tone === 'bad' ? 'b-perdu' : 'b-relance'}">${a.badge}</span></div>`).join('')}
          ${actions.length > 9 ? `<div class="t-muted" style="text-align:center;padding-top:4px">+ ${actions.length - 9} autre(s)</div>` : ''}</div>`
          : `<div class="alert"><span class="a-ico">${icon('check')}</span><div class="a-body">Aucune action en retard. Tout est à jour.</div></div>`}
      </div>
      <div class="card card-pad">
        <div class="section-head">${icon('target')}<h2>Objectifs</h2><span class="spacer"></span><button class="btn small" id="edit-obj">${icon('sliders')} Modifier</button></div>
        <div class="stat-line"><span>Devis produits (${MOIS[mo]})</span><b>${devisMois} / ${o.devisMois}</b></div>

function monthlyBarChart(yr) {
  const caM = Array(12).fill(0), maM = Array(12).fill(0);
  DB.data.ca.filter(r => r.annee === yr).forEach(r => { const m = r.mois ?? 0; caM[m] += (+r.prixVente || 0); maM[m] += marge(r); });
  const max = Math.max(1, ...caM);
  const bars = caM.map((val, i) => `<div class="bar-col" title="${MOIS[i]} — CA ${eur(val)} / Marge ${eur(maM[i])}">
    <div class="bars"><div class="bar" style="height:${val / max * 100}%"></div><div class="bar margin" style="height:${Math.max(0, maM[i]) / max * 100}%"></div></div>
    <div class="bar-lbl">${MOIS[i].slice(0, 3)}</div></div>`).join('');
  return `<div class="barchart">${bars}</div><div class="legend"><span><i style="background:var(--brand-2)"></i>Chiffre d'affaires</span><span><i style="background:var(--green)"></i>Marge brute</span></div>`;
}
function chantiersMini() {

/* ---------- Comptes OTP (un OTP regroupe plusieurs sites / devis) ---------- */
function otpRollup(code) {
  const chantiers = DB.data.chantiers.filter(c => c.otp === code);
  const devis = DB.data.devis.filter(d => d.otp === code);
  const factures = DB.data.factures.filter(f => f.otp === code);
  const caLines = DB.data.ca.filter(r => r.otp === code);
  const montantDevis = devis.reduce((s, d) => s + (+d.montantHT || 0), 0);
  const ca = caLines.reduce((s, r) => s + (+r.prixVente || 0), 0);
  const margeCa = caLines.reduce((s, r) => s + marge(r), 0);
  const achats = commandesParOtp(code);
  const mo = moAllOtp(code);
  const factEmis = factures.filter(f => f.statut !== 'a_emettre').reduce((s, f) => s + (+f.montantHT || 0), 0);
  const encaisse = factures.filter(f => f.statut === 'payee').reduce((s, f) => s + (+f.montantHT || 0), 0);
  return { chantiers, devis, factures, caLines, montantDevis, ca, margeCa, achats, mo, factEmis, encaisse };
}

/* ---------- Cadences étanchéité ---------- */
let cadMetier = 'etancheite';
const CAD_STATE = {}; // par métier : { equipe, appro, coeff:{}, surf:{}, lin:{}, inputs:{} }
function cadInit(metier) {
  const cfg = CAD_METIERS[metier];
  if (CAD_STATE[metier]) return CAD_STATE[metier];
  const st = { equipe: 2, appro: cfg.appro.def ?? 0, coeff: {}, surf: {}, lin: {}, inputs: {} };
  for (const k in cfg.coeffs) st.coeff[k] = cfg.coeffs[k].def ?? cfg.coeffs[k].opts.findIndex(o => o[1] === 1) ?? 0;
  for (const k in cfg.tasksSurf) st.surf[k] = cfg.tasksSurf[k].def ?? 0;
  for (const k in cfg.tasksLin) st.lin[k] = cfg.tasksLin[k].def ?? 0;
  cfg.inputs.forEach(i => st.inputs[i.key] = i.def ?? 0);
  CAD_STATE[metier] = st; return st;
}
function cadCompute(metier) {

  let gc = 1; for (const k in cfg.coeffs) gc *= cfg.coeffs[k].opts[st.coeff[k]] ? cfg.coeffs[k].opts[st.coeff[k]][1] : 1;
  const surf = +st.inputs['surface'] || 0;
  for (const k in cfg.tasksSurf) { const o = cfg.tasksSurf[k].opts[st.surf[k]]; if (!o || !o[1]) continue; const hM2 = o[1] * gc; steps.push({ nom: cfg.tasksSurf[k].label, detail: o[0], base: o[1] + ' h/m²', h: hM2 * surf, cad: hM2 ? HEURES_JOUR / hM2 : 0, unite: 'm²/j' }); }
  const apr = cfg.appro.opts[st.appro]; if (apr && apr[1]) { const hM2 = apr[1] * gc; steps.push({ nom: 'Approvisionnement', detail: apr[0], base: apr[1] + ' h/m²', h: hM2 * surf, cad: hM2 ? HEURES_JOUR / hM2 : 0, unite: 'm²/j' }); }
  for (const k in cfg.tasksLin) { const t = cfg.tasksLin[k], o = t.opts[st.lin[k]]; if (!o || !o[1]) continue; const inp = cfg.inputs.find(i => i.key === t.input) || { unit: 'mL' }; const metr = +st.inputs[t.input] || 0; const hU = o[1] * gc; steps.push({ nom: t.label, detail: o[0], base: o[1] + ' h/' + inp.unit, h: hU * metr, cad: hU ? HEURES_JOUR / hU : 0, unite: inp.unit + '/j' }); }
  const totalH = steps.reduce((s, x) => s + x.h, 0);
  const jours = totalH / (Math.max(1, st.equipe) * HEURES_JOUR);
  const cadGlob = jours > 0 ? surf / jours : 0;
  return { cfg, st, gc, steps, totalH, jours, cadGlob, surf };
}

  const selTask = (bag, k) => { const c = (bag === 'surf' ? cfg.tasksSurf : cfg.tasksLin)[k], unit = bag === 'surf' ? 'h/m²' : 'h/' + ((cfg.inputs.find(i => i.key === c.input) || {}).unit || 'mL'); return `<div class="field"><label>${c.label}</label><select data-task="${bag}:${k}">${c.opts.map((o, i) => `<option value="${i}" ${st[bag][k] === i ? 'selected' : ''}>${o[0]}${o[1] ? ' — ' + o[1] + ' ' + unit : ''}</option>`).join('')}</select></div>`; };
  const inputField = i => `<div class="field"><label>${i.label}</label><input data-input="${i.key}" type="number" min="0" step="any" value="${st.inputs[i.key]}"></div>`;
  v.innerHTML = `
    <div class="pill-tabs" style="flex-wrap:wrap">${Object.entries(CAD_METIERS).map(([k, m]) => `<button data-metier="${k}" class="${cadMetier === k ? 'active' : ''}">${icon(m.ico)} ${m.label}</button>`).join('')}</div>
    <p class="t-muted" style="margin:-2px 0 16px;max-width:840px">Estimateur de cadences — <b>${cfg.label}</b>. Renseignez les caractéristiques du chantier, les coefficients de complexité et les ouvrages retenus : l'outil calcule le temps de pose, la durée équipe et la cadence globale. Les temps unitaires sont <b>indicatifs (standards métier)</b> et ajustables.</p>

        <div class="card-title">1 · Caractéristiques du chantier</div>
        <div class="form-grid">
          ${cfg.inputs.map(inputField).join('')}
          <div class="field"><label>${cfg.appro.label}</label><select data-appro>${cfg.appro.opts.map((o, i) => `<option value="${i}" ${st.appro === i ? 'selected' : ''}>${o[0]} (${o[1]} h/m²)</option>`).join('')}</select></div>
          <div class="field"><label>Taille de l'équipe (personnes)</label><input data-eq type="number" min="1" value="${st.equipe}"></div>
        </div>
        <div class="card-title" style="margin-top:16px">2 · Coefficients de complexité</div>
        <div class="form-grid">${Object.keys(cfg.coeffs).map(selCoeff).join('')}</div>
      </div>
      <div class="card card-pad">
        <div class="card-title">3 · Ouvrages surfaciques (h/m²)</div>
        <div class="form-grid">${Object.keys(cfg.tasksSurf).map(k => selTask('surf', k)).join('')}</div>
        <div class="card-title" style="margin-top:16px">4 · Ouvrages linéaires / unitaires</div>
        <div class="form-grid">${Object.keys(cfg.tasksLin).map(k => selTask('lin', k)).join('')}</div>
      </div>
    </div>
    <div id="cad-out" class="cad-out" style="margin-top:16px"></div>`;
  $$('[data-metier]', v).forEach(b => b.onclick = () => { cadMetier = b.dataset.metier; renderCadences(v); });
  const readInputs = () => {
    st.equipe = Math.max(1, +v.querySelector('[data-eq]').value || 1);
    st.appro = +v.querySelector('[data-appro]').value;
    $$('[data-input]', v).forEach(el => st.inputs[el.dataset.input] = +el.value || 0);
    $$('[data-coeff]', v).forEach(sel => st.coeff[sel.dataset.coeff] = +sel.value);
    $$('[data-task]', v).forEach(sel => { const [bag, key] = sel.dataset.task.split(':'); st[bag][key] = +sel.value; });
  };
  const recompute = () => { readInputs(); $('#cad-out').innerHTML = cadencesResult(); const b = $('#cad-csv'); if (b) b.onclick = exportCadences; const ib = $('#cad-bte'); if (ib) ib.onclick = importCadenceToBte; };
  v.querySelectorAll('.card input,.card select').forEach(el => el.oninput = recompute);
  recompute();
}
function cadencesResult() {
  const { cfg, st, gc, steps, totalH, jours, cadGlob, surf } = cadCompute(cadMetier);
  return `<div class="grid-3">
    <div class="cad-metric"><div class="cm-label">Temps de pose total</div><div class="cm-value">${num(totalH)} h</div><div class="cm-sub">Coefficient global appliqué : ×${gc.toFixed(3)}</div></div>
    <div class="cad-metric green"><div class="cm-label">Durée chantier</div><div class="cm-value">${num(jours)} j</div><div class="cm-sub">équipe de ${st.equipe} pers. · ${HEURES_JOUR} h/j</div></div>
    <div class="cad-metric amber"><div class="cm-label">Cadence globale</div><div class="cm-value">${num(cadGlob)}</div><div class="cm-sub">m²/jour (${num(surf)} m²)</div></div></div>
  ${steps.length ? `<div class="table-wrap" style="margin-top:16px"><table class="cad-steps"><thead><tr><th>Étape</th><th>Choix</th><th class="num">Cadence std</th><th class="num">Cadence corrigée</th><th class="num">Temps</th></tr></thead>

    : '<p class="t-muted" style="margin-top:14px">Sélectionnez au moins un ouvrage pour lancer l\'estimation.</p>'}`;
}
function importCadenceToBte() {
  const { cfg, steps, surf } = cadCompute(cadMetier);
  if (!steps.length) { toast('Aucune tâche à importer', 'err'); return; }
  const taux = +DB.data.objectifs.tauxHoraireMO || 0;
  const lignes = steps.map(s => ({ cat: BTE_CATS[1], designation: s.nom, unite: 'h', qte: Math.round(s.h * 10) / 10, pu: taux }));
  const totalH = steps.reduce((a, s) => a + s.h, 0);
  const bteOpts = DB.data.bte.map(b => `<option value="${b.id}">${esc(b.otp || '')} ${esc(b.nom)}</option>`).join('');
  const m = modal({ title: "Importer la main d'œuvre dans un BTE",
    body: `<p class="t-muted" style="margin-top:0">${steps.length} tâche(s) · <b>${num(totalH)} h</b> au total, valorisées à ${eur(taux)}/h (taux MO). Ajoutées au poste « ${BTE_CATS[1]} ».</p>
      <div class="field"><label>BTE cible</label><select id="i-bte"><option value="">➕ Nouveau BTE (${esc(cfg.label)}${surf ? ' — ' + num(surf) + ' m²' : ''})</option>${bteOpts}</select></div>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Tâche</th><th class="num">Heures</th><th class="num">PU</th><th class="num">Total</th></tr></thead>
        <tbody>${lignes.map(l => `<tr><td>${esc(l.designation)}</td><td class="num">${num(l.qte)} h</td><td class="num">${eur(l.pu)}</td><td class="num">${eur(l.qte * l.pu)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total main d'œuvre</td><td class="num">${num(totalH)} h</td><td></td><td class="num">${eur(totalH * taux)}</td></tr></tfoot></table></div>`,
    footer: `<button class="btn" data-c>Annuler</button><button class="btn primary" id="i-go">Importer</button>` });
  m.root.querySelector('[data-c]').onclick = m.close;
  $('#i-go').onclick = () => {
    const sel = $('#i-bte').value; let bte;
    if (sel) { bte = DB.data.bte.find(x => x.id === sel); bte.lignes.push(...lignes); }
    else { bte = { id: uid(), nom: cfg.label + ' — estimation cadence', adresse: '', otp: '', dateEdition: todayISO(), margePct: 0.30, notes: 'Main d\'œuvre générée depuis le calculateur de cadences', lignes: [...lignes] }; DB.data.bte.unshift(bte); }
    DB.save(); m.close(); toast("Main d'œuvre importée dans le BTE"); go('bte'); bteEditor(bte.id);
  };
}
function exportCadences() { const { cfg, steps } = cadCompute(cadMetier); exportCSV('estimation_' + cfg.label.toLowerCase(), ['etape', 'choix', 'cadence_std', 'cadence_corrigee', 'temps_h'], steps.map(s => [s.nom, s.detail, s.base, num(s.cad) + ' ' + s.unite, num(s.h)])); }

/* ---------- Facturation & encaissement ---------- */
const STATUTS_FACT = { a_emettre: 'À émettre', emise: 'Émise', payee: 'Payée' };

  const fl = factureFlags(f);

  if (fl.retardPaiement) return `<span class="badge b-perdu">Impayée (retard)</span>`;
  if (fl.retardEmission) return `<span class="badge b-perdu">À émettre (retard)</span>`;
  return `<span class="badge ${f.statut === 'emise' ? 'b-envoye' : 'b-attente'}">${STATUTS_FACT[f.statut]}</span>`;
}

      <div class="kpi"><div class="kpi-top"><span class="kpi-label">Taux de recouvrement</span><span class="kpi-ico">${icon('trend')}</span></div><div class="kpi-value">${recouvre} %</div><div class="progress ${recouvre >= 90 ? 'green' : ''}"><i style="width:${recouvre}%"></i></div></div>

    <td><input class="ts-f" data-k="otp" value="${esc(r.otp)}" list="ts-otp" placeholder="Imputation" style="width:118px"></td>
    ${days.map(i => `<td class="num"><input class="ts-h" data-i="${i}" type="number" min="0" step="0.5" value="${r.h && r.h[i] ? r.h[i] : ''}"></td>`).join('')}
    <td class="num t-strong rtot">${num(rowTot(r))}</td>

    <td class="num"><input class="ts-f" data-k="trajet" type="number" min="0" value="${r.trajet || ''}" style="width:42px"></td>
    <td><select class="ts-f" data-k="zone" style="width:60px"><option value=""></option>${[1, 2, 3, 4, 5].map(z => `<option ${String(r.zone) === String(z) ? 'selected' : ''}>${z}</option>`).join('')}</select></td>
    <td><button class="icon-btn danger" data-del="${r.id}" title="Supprimer la ligne">${icon('trash')}</button></td></tr>`;
  const colTot = i => rows.reduce((s, r) => s + (r.h && r.h[i] ? +r.h[i] : 0), 0);

  v.innerHTML = `
    <div class="ts-person">
      <div class="ts-avatar">${esc(initiales(worker.nom))}</div>
      <div style="min-width:200px">
        <select id="ts-worker" class="ts-workersel">${workers.map(w => `<option value="${w.key}" ${w.key === planWorkerKey ? 'selected' : ''}>${esc(w.nom)} — ${esc(w.equipe)} · ${w.role}</option>`).join('')}</select>
        <div class="ts-prog"><div class="ts-prog-lbl">${num(persoTot)} H / ${HEBDO_H}.00 H</div><div class="progress ${prog >= 100 ? 'green' : prog >= 60 ? '' : 'amber'}"><i style="width:${prog}%"></i></div></div>
      </div>
    </div>
    <div class="page-actions">
      <button class="btn small" id="prev">◀</button>
      <input id="wk" type="date" value="${planWeek}" style="border:1px solid var(--line);border-radius:8px;padding:7px 10px">
      <span class="chip">${fmtDate(planWeek)} – ${fmtDate(addDays(planWeek, 6))}</span>
      <button class="btn small" id="next">▶</button>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="we" ${planWE ? 'checked' : ''}> WE</label>
      <span class="spacer"></span>
      <button class="btn small" id="teams">${icon('users')} Équipes</button>
      <button class="btn small" id="csv">${icon('download')} CSV</button>
      <button class="btn primary" id="add">${icon('plus')} Ajouter</button>
    </div>
    <datalist id="ts-cats"><option value="3000111"></datalist>
    <datalist id="ts-otp">${chList}</datalist>
    <div class="table-wrap"><table class="ts-grid"><thead><tr>
      <th>Catégorie</th><th>Type</th><th>Imputation</th>
      ${days.map(i => `<th class="num">${JSEM[i]}<div class="t-muted" style="font-weight:400">${fmtDate(addDays(planWeek, i)).slice(0, 5)}</div></th>`).join('')}
      <th class="num">Total</th><th class="num" title="Panier repas">Panier</th><th class="num" title="Trajet">Trajet</th><th>Zone</th><th></th></tr></thead>
      <tbody id="ts-body">${rows.length ? rows.map(rowHtml).join('') : ''}</tbody>
      <tfoot><tr><td colspan="3">Total</td>${days.map(i => `<td class="num ctot" data-i="${i}">${num(colTot(i))}</td>`).join('')}<td class="num" id="ts-grand">${num(persoTot)}</td><td colspan="4"></td></tr></tfoot>
    </table></div>
    ${rows.length ? '<div class="field hint" style="margin-top:8px">Saisie automatiquement enregistrée. Les heures pointées par imputation (OTP) alimentent la MO SMAC du CA.</div>' : '<div class="empty" style="padding:30px"><div class="em-ico">' + icon('clock') + '</div><h3>Aucune ligne cette semaine</h3><div>Cliquez sur « Ajouter » pour saisir une imputation.</div></div>'}`;

  const bind = () => {
    $('#ts-worker', v).onchange = e => { planWorkerKey = e.target.value; renderPointages(v); };

    $('#prev', v).onclick = () => { planWeek = addDays(planWeek, -7); renderPointages(v); };
    $('#next', v).onclick = () => { planWeek = addDays(planWeek, 7); renderPointages(v); };
    $('#wk', v).onchange = e => { planWeek = mondayISO(new Date(e.target.value + 'T00:00:00')); renderPointages(v); };
    $('#teams', v).onclick = () => equipesModal();

    $('#csv', v).onclick = () => exportCSV('pointages_' + esc(worker.nom) + '_' + planWeek, ['categorie', 'type', 'imputation', ...days.map(i => JSEM[i]), 'total', 'panier', 'trajet', 'zone'], rows.map(r => [r.categorie, r.typeHeure, r.otp, ...days.map(i => r.h[i] || 0), rowTot(r), r.panier, r.trajet, r.zone]));
    $$('#ts-body tr', v).forEach(tr => {
      const r = DB.data.pointages.find(x => x.id === tr.dataset.id);
      tr.querySelectorAll('.ts-h').forEach(inp => inp.oninput = () => { r.h[+inp.dataset.i] = +inp.value || 0; DB.save(); refreshTot(); });
      tr.querySelectorAll('.ts-f').forEach(f => f.onchange = () => { const k = f.dataset.k; r[k] = (k === 'panier' || k === 'trajet') ? (+f.value || 0) : f.value; if (k === 'otp') { const c = DB.data.chantiers.find(x => x.otp === f.value); r.chantierNom = c ? c.nom : ''; } DB.save(); });
      tr.querySelector('[data-del]').onclick = () => { DB.data.pointages = DB.data.pointages.filter(x => x.id !== r.id); DB.save(); renderPointages(v); };
    });
  };
  const refreshTot = () => {
    const rws = DB.data.pointages.filter(r => r.workerKey === planWorkerKey && r.semaine === planWeek);
    $$('#ts-body tr', v).forEach(tr => { const r = rws.find(x => x.id === tr.dataset.id); if (r) tr.querySelector('.rtot').textContent = num(rowTot(r)); });
    days.forEach(i => { const el = v.querySelector(`.ctot[data-i="${i}"]`); if (el) el.textContent = num(rws.reduce((s, r) => s + (r.h && r.h[i] ? +r.h[i] : 0), 0)); });
    const pt = rws.reduce((s, r) => s + rowTot(r), 0);
    $('#ts-grand', v).textContent = num(pt);
    const pr = Math.min(100, Math.round(pt / HEBDO_H * 100));
    v.querySelector('.ts-prog-lbl').textContent = num(pt) + ' H / ' + HEBDO_H + '.00 H';
    const bar = v.querySelector('.ts-prog .progress'); bar.className = 'progress ' + (pr >= 100 ? 'green' : pr >= 60 ? '' : 'amber'); bar.querySelector('i').style.width = pr + '%';
  };
  bind();
  return;
}

/* ---------- Calendrier du mois (agenda perso + équipes) ---------- */
const AGENDA_TYPES = { perso: 'Perso / bureau', chantier: 'Équipe sur chantier', reunion: 'Réunion / RDV', conges: 'Congés / absence', autre: 'Autre' };
const TEAM_PALETTE = ['#2568b3', '#1f7a4d', '#9a6700', '#5b3fb0', '#b3261e', '#0e7490', '#be185d', '#4d7c0f'];
const teamColor = id => { const i = DB.data.equipes.findIndex(e => e.id === id); return i < 0 ? '#64748b' : TEAM_PALETTE[i % TEAM_PALETTE.length]; };
const typeColor = t => ({ perso: '#475569', reunion: '#5b3fb0', conges: '#b3261e', autre: '#0e7490' }[t] || '#475569');
let planMonth = new Date().getMonth(), planYear = new Date().getFullYear();
let planFilter = { perso: true, equipes: true };
function dayEvents(iso, dateObj) {
  const evs = [];
  if (planFilter.perso) {
    DB.data.agenda.filter(a => a.type !== 'chantier' && a.dateDebut && iso >= a.dateDebut && iso <= (a.dateFin || a.dateDebut)).forEach(a => evs.push({ color: typeColor(a.type), label: a.title, agendaId: a.id }));
    DB.data.prospection.filter(p => p.date === iso).forEach(p => evs.push({ color: '#2568b3', label: 'RDV · ' + p.nom, route: 'prospection' }));
    DB.data.visites.filter(x => x.datePrevue === iso).forEach(x => { const c = DB.data.contrats.find(y => y.id === x.contratId); evs.push({ color: '#9a6700', label: 'Visite · ' + (c ? clientNom(c.clientId) : ''), route: 'entretien' }); });
  }
  if (planFilter.equipes) {
    DB.data.agenda.filter(a => a.type === 'chantier' && a.dateDebut && iso >= a.dateDebut && iso <= (a.dateFin || a.dateDebut)).forEach(a => { const eq = DB.data.equipes.find(e => e.id === a.equipeId); evs.push({ color: teamColor(a.equipeId), label: (eq ? eq.nom + ' · ' : '') + a.title, agendaId: a.id }); });
    DB.data.pointages.forEach(r => { if (!r.h) return; const di = daysBetween(r.semaine, iso); if (di >= 0 && di < 7 && r.h[di]) evs.push({ color: teamColor(r.equipeId), label: r.workerNom + ' · ' + (r.chantierNom || r.otp || ''), route: 'planning-sem' }); });
  }
  return evs;
}
function renderCalendar(v) {
  const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const first = new Date(planYear, planMonth, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const gridStart = new Date(planYear, planMonth, 1 - startOffset);
  const cells = []; for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }
  const iso = d => d.toISOString().slice(0, 10);
  const cellHtml = d => {
    const inMo = d.getMonth() === planMonth, isoD = iso(d), isToday = isoD === todayISO();
    const evs = dayEvents(isoD, d);
    const shown = evs.slice(0, 4);
    return `<div class="cal-cell ${inMo ? '' : 'out'} ${isToday ? 'today' : ''}" data-day="${isoD}">
      <div class="cal-daynum">${d.getDate()}</div>
      ${shown.map((e, i) => `<span class="cal-ev" style="background:${e.color}" ${e.agendaId ? `data-ev="${e.agendaId}"` : e.route ? `data-route="${e.route}"` : ''} title="${esc(e.label)}">${esc(e.label)}</span>`).join('')}
      ${evs.length > 4 ? `<div class="cal-more">+ ${evs.length - 4}</div>` : ''}</div>`;
  };
  v.innerHTML = `
    <div class="page-actions">
      <button class="btn primary" id="c-add">${icon('plus')} Événement</button>
      <button class="btn" id="c-teams">${icon('users')} Équipes</button>
      <span class="spacer"></span>
      <button class="btn small" id="c-prev">◀</button>
      <span class="chip" style="min-width:150px;justify-content:center">${MOIS[planMonth]} ${planYear}</span>
      <button class="btn small" id="c-next">▶</button>
      <button class="btn small" id="c-today">Aujourd'hui</button>
    </div>
    <div class="filters">
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="c-fperso" ${planFilter.perso ? 'checked' : ''}> Mon planning (RDV, visites, perso)</label>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="c-fequipes" ${planFilter.equipes ? 'checked' : ''}> Compagnons / équipes</label>
      ${DB.data.equipes.map(e => `<span class="chip"><i style="width:10px;height:10px;border-radius:3px;background:${teamColor(e.id)};display:inline-block"></i> ${esc(e.nom)}</span>`).join('')}
    </div>
    <div class="cal-wrap"><div class="cal-inner">
      <div class="cal-grid cal-head">${JOURS.map(j => `<div class="cal-hd">${j}</div>`).join('')}</div>
      <div class="cal-grid">${cells.map(cellHtml).join('')}</div>
    </div></div>`;
  $('#c-add').onclick = () => agendaForm();
  $('#c-teams').onclick = () => equipesModal();
  $('#c-prev').onclick = () => { planMonth--; if (planMonth < 0) { planMonth = 11; planYear--; } renderPlanning($('#view')); };
  $('#c-next').onclick = () => { planMonth++; if (planMonth > 11) { planMonth = 0; planYear++; } renderPlanning($('#view')); };
  $('#c-today').onclick = () => { planMonth = new Date().getMonth(); planYear = new Date().getFullYear(); renderPlanning($('#view')); };
  $('#c-fperso').onchange = e => { planFilter.perso = e.target.checked; renderPlanning($('#view')); };
  $('#c-fequipes').onchange = e => { planFilter.equipes = e.target.checked; renderPlanning($('#view')); };
  $$('.cal-cell', v).forEach(cell => cell.onclick = e => { if (e.target.closest('[data-ev]') || e.target.closest('[data-route]')) return; agendaForm(null, cell.dataset.day); });
  $$('[data-ev]', v).forEach(el => el.onclick = e => { e.stopPropagation(); agendaForm(el.dataset.ev); });
  $$('[data-route]', v).forEach(el => el.onclick = e => { e.stopPropagation(); const r = el.dataset.route; if (r === 'planning-sem') { planTab = 'semaine'; renderPlanning($('#view')); } else go(r); });
}
function agendaForm(id, presetDate) {
  const a = id ? DB.data.agenda.find(x => x.id === id) : { title: '', type: 'perso', dateDebut: presetDate || todayISO(), dateFin: '', equipeId: (DB.data.equipes[0] || {}).id || '', otp: '', note: '' };
  const eqOpts = DB.data.equipes.map(e => `<option value="${e.id}" ${a.equipeId === e.id ? 'selected' : ''}>${esc(e.nom)} (${esc(e.chef)})</option>`).join('');
  const m = modal({ title: id ? "Modifier l'événement" : 'Nouvel événement',
    body: `<div class="form-grid">
      <div class="field"><label>Type</label><select id="a-type">${Object.entries(AGENDA_TYPES).map(([k, l]) => `<option value="${k}" ${a.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field" id="a-eqwrap"><label>Équipe</label><select id="a-eq">${eqOpts || '<option value="">—</option>'}</select></div>
      <div class="field full"><label>Intitulé</label><input id="a-title" value="${esc(a.title)}" placeholder="RDV client, chantier, congés…"></div>
      <div class="field"><label>Du</label><input id="a-deb" type="date" value="${a.dateDebut || todayISO()}"></div>
      <div class="field"><label>Au (optionnel)</label><input id="a-fin" type="date" value="${a.dateFin || ''}"></div>
      <div class="field"><label>OTP (optionnel)</label><input id="a-otp" value="${esc(a.otp)}" list="a-otplist"><datalist id="a-otplist">${otpDistinct().map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>
      <div class="field"><label>Note</label><input id="a-note" value="${esc(a.note)}"></div>
    </div>`,
    footer: `${id ? `<button class="btn danger" id="a-del">${icon('trash')} Supprimer</button>` : ''}<span class="spacer"></span><button class="btn" data-c>Annuler</button><button class="btn primary" id="a-save">Enregistrer</button>` });
  m.root.querySelector('.modal-foot').style.justifyContent = 'flex-start';
  const syncEq = () => { $('#a-eqwrap').style.display = $('#a-type').value === 'chantier' ? '' : 'none'; };
  $('#a-type').onchange = syncEq; syncEq();
  m.root.querySelector('[data-c]').onclick = m.close;
  if (id) $('#a-del').onclick = () => { DB.data.agenda = DB.data.agenda.filter(x => x.id !== id); DB.save(); m.close(); toast('Événement supprimé'); renderPlanning($('#view')); };
  $('#a-save').onclick = () => {
    const type = $('#a-type').value;
    const obj = { title: $('#a-title').value.trim(), type, equipeId: type === 'chantier' ? $('#a-eq').value : '', dateDebut: $('#a-deb').value, dateFin: $('#a-fin').value, otp: $('#a-otp').value.trim(), note: $('#a-note').value.trim() };
    if (!obj.title) { toast("L'intitulé est obligatoire", 'err'); return; }
    if (!obj.dateDebut) { toast('La date est obligatoire', 'err'); return; }
    if (id) Object.assign(a, obj); else DB.data.agenda.unshift({ id: uid(), ...obj });
    DB.save(); m.close(); toast('Événement enregistré'); planTab = 'mois'; renderPlanning($('#view'));
  };
}
function equipesModal() {
  const m = modal({ title: 'Équipes', wide: true,

    footer: `<button class="btn" data-c>Fermer</button><button class="btn primary" id="e-save">Enregistrer</button>` });

  $('#e-save').onclick = () => {

      <tbody>${list.map(c => `<tr><td class="t-strong">${esc(c.num || '—')}</td><td>${fmtDate(c.date)}</td><td><span class="chip">${esc(c.otp || '—')}</span></td><td>${esc(c.fournisseur || '—')}</td><td>${esc(c.objet || '—')}</td><td>${cmdBadge(c.statut)}</td>

        <td class="actions-cell">${c.dateReception ? '' : `<button class="icon-btn" data-recv="${c.id}" title="Réceptionner aujourd'hui">${icon('check')}</button>`}<button class="icon-btn" data-edit="${c.id}" title="Modifier">${icon('edit')}</button><button class="icon-btn danger" data-del="${c.id}" title="Supprimer">${icon('trash')}</button></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="7">Total affiché${achatFilter.otp ? ' — OTP ' + esc(achatFilter.otp) : ''}</td><td class="num">${eur(total)}</td><td></td></tr></tfoot></table></div>`
      : emptyState('cart', 'Aucune commande fournisseur', 'Chaque commande est imputée sur un OTP ; réceptionnez-la au mois voulu pour l\'imputer au CA.')}`;
  $('#add').onclick = () => achatForm();
  $('#recept').onclick = () => receptionPicker();
  $('#q').oninput = e => { achatFilter.q = e.target.value; renderAchats(v); const i = $('#q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  $('#fotp').onchange = e => { achatFilter.otp = e.target.value; renderAchats(v); };
  $$('[data-fotp]', v).forEach(b => b.onclick = () => { achatFilter.otp = b.dataset.fotp; renderAchats(v); });
  $('#csv').onclick = () => exportCSV('achats', ['num', 'date', 'otp', 'fournisseur', 'objet', 'statut', 'reception', 'montantHT'], list.map(c => [c.num, c.date, c.otp, c.fournisseur, c.objet, STATUTS_CMD[c.statut], c.dateReception, c.montantHT]));
  $$('[data-edit]', v).forEach(b => b.onclick = () => achatForm(b.dataset.edit));
  $$('[data-recv]', v).forEach(b => b.onclick = () => { const c = DB.data.commandes.find(x => x.id === b.dataset.recv); c.dateReception = todayISO(); if (c.statut === 'commande') c.statut = 'livree'; DB.save(); toast('Commande réceptionnée'); renderAchats(v); });
  $$('[data-del]', v).forEach(b => b.onclick = () => confirmDialog('Supprimer cette commande ?', () => { DB.data.commandes = DB.data.commandes.filter(x => x.id !== b.dataset.del); DB.save(); toast('Commande supprimée'); renderAchats(v); }));
}
function receptionPicker() {
  const cand = DB.data.commandes.filter(c => !c.dateReception).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const m = modal({ title: 'Réception de commandes — imputation au mois', wide: true,
    body: `<p class="t-muted" style="margin-top:0">Choisissez les commandes à <b>réceptionner</b> et la <b>date de réception</b> : elles seront imputées aux fournitures du CA du mois correspondant.</p>
    <div class="field" style="max-width:240px"><label>Date de réception</label><input id="r-date" type="date" value="${todayISO()}"></div>
    ${cand.length ? `<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th><input type="checkbox" id="r-all"></th><th>Date</th><th>OTP</th><th>Fournisseur</th><th>Objet</th><th class="num">Montant HT</th></tr></thead>
      <tbody>${cand.map((c, i) => `<tr><td><input type="checkbox" class="r-chk" data-i="${i}" checked></td><td>${fmtDate(c.date)}</td><td class="t-strong">${esc(c.otp || '—')}</td><td>${esc(c.fournisseur || '—')}</td><td>${esc(c.objet || '—')}</td><td class="num">${eur(c.montantHT)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty" style="padding:30px"><div class="em-ico">${icon('checkSquare')}</div><h3>Aucune commande en attente</h3><div>Toutes les commandes sont réceptionnées.</div></div>`}`,
    footer: cand.length ? `<button class="btn" data-c>Annuler</button><button class="btn primary" id="r-go">Réceptionner la sélection</button>` : `<button class="btn" data-c>Fermer</button>` });
  m.root.querySelector('[data-c]').onclick = m.close;
  if (!cand.length) return;
  $('#r-all').onclick = e => $$('.r-chk', m.root).forEach(c => c.checked = e.target.checked);
  $('#r-go').onclick = () => {
    const dr = $('#r-date').value || todayISO();
    const chosen = $$('.r-chk', m.root).filter(c => c.checked).map(c => cand[+c.dataset.i]);
    if (!chosen.length) { toast('Sélectionnez au moins une commande', 'err'); return; }
    chosen.forEach(c => { c.dateReception = dr; if (c.statut === 'commande') c.statut = 'livree'; });
    DB.save(); m.close(); toast(chosen.length + ' commande(s) réceptionnée(s)'); go('achats');
  };
}
function achatForm(id) {
  const c = id ? DB.data.commandes.find(x => x.id === id) : { num: '', date: todayISO(), otp: '', fournisseur: '', objet: '', montantHT: 0, statut: 'commande', dateReception: '' };
  const m = modal({ title: id ? 'Modifier la commande' : 'Nouvelle commande fournisseur',
    body: `<div class="form-grid">
      <div class="field"><label>N° de commande</label><input id="f-num" value="${esc(c.num)}" placeholder="45XXXXXXXX" maxlength="10" inputmode="numeric"><div class="hint">10 chiffres, commence par 45</div></div>
      <div class="field"><label>Date de commande</label><input id="f-date" type="date" value="${c.date || todayISO()}"></div>
      <div class="field"><label>N° OTP (imputation)</label><input id="f-otp" value="${esc(c.otp)}" list="cmd-otplist" placeholder="OTP…"><datalist id="cmd-otplist">${[...new Set([...otpDistinct(), ...DB.data.chantiers.map(ch => ch.otp).filter(Boolean)])].map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>
      <div class="field"><label>Fournisseur</label><input id="f-four" value="${esc(c.fournisseur)}" placeholder="IKO, Loxam…" list="four-list"><datalist id="four-list">${FOURNISSEURS_REF.map(f => `<option value="${esc(f.n)}">${f.c}</option>`).join('')}</datalist><div class="hint" id="f-fourcode">${c.fournisseurCode ? 'N° ' + esc(c.fournisseurCode) : ''}</div></div>
      <div class="field"><label>Statut</label><select id="f-statut">${Object.entries(STATUTS_CMD).map(([k, l]) => `<option value="${k}" ${c.statut === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field full"><label>Objet</label><input id="f-objet" value="${esc(c.objet)}" placeholder="Fournitures, location…"></div>
      <div class="field"><label>Montant HT (€)</label><input id="f-montant" type="number" value="${c.montantHT || 0}"></div>
      <div class="field"><label>Date de réception (imputation au CA)</label><input id="f-recept" type="date" value="${c.dateReception || ''}"></div>
    </div>
    <div class="field hint" style="margin-top:6px">Imputée sur l'OTP indiqué. Elle alimente les fournitures du CA du <b>mois de réception</b> ; laissez la réception vide tant qu'elle n'est pas reçue.</div>`,
    footer: `<button class="btn" data-c>Annuler</button><button class="btn primary" id="save">Enregistrer</button>` });
  m.root.querySelector('[data-c]').onclick = m.close;
  const fourCode = () => { const f = FOURNISSEURS_REF.find(x => x.n.toLowerCase() === $('#f-four').value.trim().toLowerCase()); $('#f-fourcode').textContent = f ? 'N° ' + f.c : ''; return f ? f.c : (c.fournisseurCode || ''); };
  $('#f-four').oninput = fourCode;
  $('#save').onclick = () => {
    const numv = $('#f-num').value.trim();
    if (numv && !/^45\d{8}$/.test(numv)) { toast('Le n° de commande doit comporter 10 chiffres et commencer par 45', 'err'); return; }
    const obj = { num: numv, date: $('#f-date').value, otp: $('#f-otp').value.trim(), fournisseur: $('#f-four').value.trim(), fournisseurCode: fourCode(), objet: $('#f-objet').value.trim(), montantHT: +$('#f-montant').value || 0, statut: $('#f-statut').value, dateReception: $('#f-recept').value };
    if (!obj.otp) { toast("L'OTP est obligatoire", 'err'); return; }
    if (id) Object.assign(c, obj); else DB.data.commandes.unshift({ id: uid(), ...obj });
    DB.save(); m.close(); toast('Commande enregistrée'); go('achats');
  };
}

/* -------------------------------------------------------------------------
   9. Helpers UI + export/import
   ------------------------------------------------------------------------- */
function emptyState(ico, title, sub) { return `<div class="empty"><div class="em-ico">${icon(ico)}</div><h3>${esc(title)}</h3><div>${esc(sub)}</div></div>`; }
function download(name, content, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCSV(name, headers, rows) {
  const csv = [headers.join(';'), ...rows.map(r => r.map(cell => { const s = String(cell ?? '').replace(/"/g, '""'); return /[";\n]/.test(s) ? `"${s}"` : s; }).join(';'))].join('\r\n');
  download(name + '.csv', '﻿' + csv, 'text/csv;charset=utf-8'); toast('Export CSV généré');
}

/* ---- Générateur XLSX minimal (autonome, sans librairie) ---- */
const _crcTab = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function _crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = _crcTab[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function _zip(files) {
  const enc = new TextEncoder(), u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >> 24) & 255];
  const locals = [], centrals = []; let offset = 0;
  files.forEach(f => {
    const nameB = enc.encode(f.name), data = f.data, crc = _crc32(data), sz = data.length;
    const lh = [0x50, 0x4b, 0x03, 0x04, ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nameB.length), ...u16(0)];
    const la = new Uint8Array(lh.length + nameB.length + sz); la.set(lh, 0); la.set(nameB, lh.length); la.set(data, lh.length + nameB.length);
    locals.push(la);
    const ch = [0x50, 0x4b, 0x01, 0x02, ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)];
    const ca = new Uint8Array(ch.length + nameB.length); ca.set(ch, 0); ca.set(nameB, ch.length);
    centrals.push(ca); offset += la.length;
  });
  const cSize = centrals.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array([0x50, 0x4b, 0x05, 0x06, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cSize), ...u32(offset), ...u16(0)]);
  const parts = [...locals, ...centrals, eocd], total = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(total);
  let o = 0; parts.forEach(p => { out.set(p, o); o += p.length; });
  return out;
}
const _colL = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
const _xe = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function _sheetXml(rows, widths) {
  let body = '';
  rows.forEach((row, ri) => {
    let cells = '';
    (row || []).forEach((cell, ci) => {
      if (cell == null) return;
      const ref = _colL(ci) + (ri + 1), s = cell.s ? ` s="${cell.s}"` : '';
      if (typeof cell === 'number') { cells += `<c r="${ref}"><v>${cell}</v></c>`; return; }
      if (typeof cell === 'string') { cells += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${_xe(cell)}</t></is></c>`; return; }
      if (cell.v === undefined && cell.f === undefined) { if (cell.s) cells += `<c r="${ref}"${s}/>`; return; }
      if (typeof cell.v === 'number' || cell.n) cells += `<c r="${ref}"${s}><v>${cell.v}</v></c>`;
      else cells += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${_xe(cell.v)}</t></is></c>`;
    });
    body += `<row r="${ri + 1}">${cells}</row>`;
  });
  const cols = widths ? `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${body}</sheetData></worksheet>`;
}
const _XLSX_STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEDF2F7"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFB8C2D0"/></left><right style="thin"><color rgb="FFB8C2D0"/></right><top style="thin"><color rgb="FFB8C2D0"/></top><bottom style="thin"><color rgb="FFB8C2D0"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyNumberFormat="1"/><xf numFmtId="4" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyNumberFormat="1"/><xf numFmtId="4" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs></styleSheet>`;
function writeXlsx(filename, sheetName, rows, widths) {
  const enc = new TextEncoder();
  const files = [
    { name: '[Content_Types].xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`) },
    { name: '_rels/.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`) },
    { name: 'xl/workbook.xml', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${_xe(sheetName).slice(0, 31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`) },
    { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`) },
    { name: 'xl/styles.xml', data: enc.encode(_XLSX_STYLES) },
    { name: 'xl/worksheets/sheet1.xml', data: enc.encode(_sheetXml(rows, widths)) },
  ];
  download(filename, _zip(files), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function exportBteXlsx(b) {
  const t = bteTotals(b);
  const N = { n: true }; // marqueur nombre
  const rows = [];
  rows[0] = [{ v: b.adresse || '', s: 1 }, null, { v: "Date d'édition :", s: 1 }, { v: b.dateEdition ? fmtDate(b.dateEdition) : '' }];
  rows[2] = [{ v: b.nom || '', s: 1 }, null, null, null, { v: 'BTE', s: 1 }];
  rows[3] = [null, null, null, { v: 'TOTAL DÉPENSES :', s: 1 }, { v: t.dep, s: 7 }];
  rows[4] = [{ v: 'OTP : ' + (b.otp || ''), s: 1 }, null, null, { v: 'MARGE BRUTE % :', s: 1 }, { v: (t.margePct * 100).toFixed(1) + ' %', s: 1 }];
  rows[5] = [null, null, null, { v: 'PRIX DE VENTE :', s: 1 }, { v: t.pv, s: 7 }];
  rows[6] = [{ v: 'DÉSIGNATIONS', s: 3 }, { v: 'Quantités', s: 3 }, { v: 'Uni.', s: 3 }, { v: 'PU', s: 3 }, { v: 'TOTAL', s: 3 }];
  let ri = 7;
  BTE_CATS.forEach(cat => {
    rows[ri++] = [{ v: cat, s: 4 }, { v: '', s: 4 }, { v: '', s: 4 }, { v: '', s: 4 }, { v: '', s: 4 }];
    b.lignes.filter(l => l.cat === cat).forEach(l => { rows[ri++] = [{ v: l.designation || '', s: 2 }, { v: +l.qte || 0, s: 2 }, { v: l.unite || '', s: 2 }, { v: +l.pu || 0, s: 5 }, { v: (+l.qte || 0) * (+l.pu || 0), s: 5 }]; });
    rows[ri++] = [null, null, null, { v: 'Total ' + cat.replace(/^\d+\s*\.\s*/, '') + ' :', s: 4 }, { v: t.parCat[cat] || 0, s: 6 }];
  });
  writeXlsx('BTE_' + (b.otp || b.nom || 'chantier') + '.xlsx', 'BTE', rows, [52, 11, 10, 13, 14]);
  toast('Export Excel généré');
}
function exportAll() {
  const p = DB.currentProfile();
  download('chargepro-' + (p ? initiales(p.nom) : 'profil') + '-' + todayISO() + '.json', JSON.stringify({ profil: p, data: DB.data }, null, 2), 'application/json');
  toast('Sauvegarde exportée');
}
function importAll(file) {
  const r = new FileReader();
  r.onload = () => { try {
    const parsed = JSON.parse(r.result);
    const data = parsed && parsed.data ? parsed.data : parsed; // compat ancien format
    if (!data || typeof data !== 'object') throw 0;
    DB.data = DB.normalize(data); DB.save(); toast('Sauvegarde restaurée dans le profil courant'); go(current);
  } catch { toast('Fichier invalide', 'err'); } };
  r.readAsText(file);
}

/* -------------------------------------------------------------------------
   10. Boot
   ------------------------------------------------------------------------- */
function boot() {
  $('#brand-mark').innerHTML = icon('layers');
  $('#menu-toggle').innerHTML = icon('menu');
  buildNav();
  $('#year-badge').textContent = 'Année ' + new Date().getFullYear();
  $('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');
  $('#profile-btn').onclick = e => { e.stopPropagation(); toggleProfileMenu(); };
  $('#btn-export').onclick = exportAll;
  $('#btn-import').onclick = () => $('#import-file').click();
  $('#import-file').onchange = e => { if (e.target.files[0]) importAll(e.target.files[0]); e.target.value = ''; };
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== current) go(r); });

  DB.loadMeta();
  if (!DB.meta.profiles.length) { renderProfileButton(); firstRun(); return; }
  if (!DB.currentProfile()) DB.meta.currentId = DB.meta.profiles[0].id;
  DB.loadProfile(DB.meta.currentId);
  renderProfileButton();
  go(location.hash.slice(1) || 'dashboard');
}
boot();
