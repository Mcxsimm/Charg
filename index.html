<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargéPro — Assistant Chargé d'Affaires</title>
  <meta name="description" content="Outil de pilotage pour chargé d'affaires étanchéité : chantiers, devis, CA & marge, BTE, cadences.">
  <style>
:root{
  --bg:#0e1b2b; --bg2:#13233a;
  --panel:#ffffff; --panel-2:#f6f8fb; --panel-3:#eef2f7;
  --ink:#111c2e; --ink-soft:#48566b; --muted:#8b98ab; --line:#e3e9f0;
  --brand:#1b4f8a; --brand-2:#2568b3; --brand-ink:#e9f1fa; --brand-soft:#f0f6fc;
  --green:#1f7a4d; --green-bg:#e6f4ec;
  --red:#b3261e; --red-bg:#fbeae9;
  --amber:#9a6700; --amber-bg:#fdf3dd;
  --violet:#5b3fb0; --violet-bg:#efeafb;
  --radius:10px;
  --shadow-sm:0 1px 2px rgba(16,30,54,.06);
  --shadow:0 1px 2px rgba(16,30,54,.05),0 6px 20px -8px rgba(16,30,54,.10);
  --shadow-md:0 4px 12px -3px rgba(16,30,54,.10),0 14px 34px -10px rgba(16,30,54,.16);
  --shadow-lg:0 24px 60px -14px rgba(16,30,54,.30);
  --sidebar-w:246px;
  /* Affichage adaptatif — pilotés par les préférences d'écran (voir html[data-*]) */
  --content-max:1720px;   /* largeur utile maxi du contenu */
  --view-pad-x:26px;      /* marges latérales de la vue */
  --view-pad-t:24px;
  --gap:16px;             /* gouttière des grilles */
  --card-pad:18px 20px;
  --kpi-min:232px;        /* largeur mini d'une tuile KPI */
  --row-py:10px;          /* hauteur de ligne des tableaux */
  --row-px:14px;
  --th-py:11px;
  --table-fs:13px;
  --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  /* Motion — courbes fortes façon Emil Kowalski (les easings CSS natifs manquent de punch) */
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--panel-2);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px}
h1,h2,h3{margin:0}

.ic{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}

#app{display:flex;min-height:100vh}

/* ---------------- Sidebar ---------------- */
#sidebar{width:var(--sidebar-w);background:var(--bg);color:#aebacb;display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;height:100vh;z-index:40;border-right:1px solid #0a1420}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brand-2),var(--brand));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand-mark .ic{width:20px;height:20px}
.brand-name{font-weight:700;font-size:16px;color:#fff;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:#6f8199;letter-spacing:.3px;text-transform:uppercase}
#nav{display:flex;flex-direction:column;gap:1px;padding:10px 12px;flex:1;overflow:auto}
.nav-group{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:#5c6f88;font-weight:700;padding:12px 12px 5px}
.nav-group:first-child{padding-top:4px}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#aebacb;
  padding:10px 12px;border-radius:8px;text-align:left;font-size:13.5px;font-weight:500;width:100%;
  transition:background .14s var(--ease-out),color .14s var(--ease-out),transform .13s var(--ease-out)}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item:active{transform:scale(.985)}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 10px -2px rgba(27,79,138,.6)}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--brand-2)}
.nav-item.active .ic{color:#fff}
.nav-item .ic{color:#8697ad;transition:color .14s var(--ease-out)}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:8px}
.foot-row{display:flex;gap:8px}
.mini-btn{flex:1;background:rgba(255,255,255,.05);color:#b7c3d4;border:1px solid rgba(255,255,255,.09);
  border-radius:7px;padding:8px 6px;font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:background .15s var(--ease-out),color .15s var(--ease-out),transform .13s var(--ease-out)}
.mini-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.mini-btn:active{transform:scale(.96)}
.foot-note{font-size:10px;color:#5c6f88;text-align:center;line-height:1.4}

/* ---------------- Main ---------------- */
#main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 var(--view-pad-x);height:60px}
#menu-toggle{display:none;background:none;border:0;color:var(--ink);padding:6px}
#nav-collapse{display:inline-flex;margin-left:-6px}
#page-title{font-size:18px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.year-badge{color:var(--ink-soft);font-weight:600;font-size:12.5px}

/* Profile switcher */
.profile-btn{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:6px 10px 6px 8px;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);
  transition:border-color .15s var(--ease-out),box-shadow .15s var(--ease-out),transform .13s var(--ease-out)}
.profile-btn:hover{border-color:var(--brand-2);box-shadow:var(--shadow)}
.profile-btn:active{transform:scale(.97)}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--brand-ink);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.profile-btn .p-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-btn .ic{color:var(--muted)}
.menu{position:absolute;top:54px;right:var(--view-pad-x);background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);width:280px;z-index:50;overflow:hidden;
  transform-origin:top right;animation:menu-in .16s var(--ease-out)}
@keyframes menu-in{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.menu-head{padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;font-weight:500;width:100%;background:none;border:0;text-align:left;
  transition:background .12s var(--ease-out),color .12s var(--ease-out)}
.menu-item:hover{background:var(--panel-2)}
.menu-item:active{background:var(--panel-3)}
.menu-item.active{color:var(--brand);font-weight:600}
.menu-item .ic{color:var(--muted)}
.menu-item.active .ic{color:var(--brand)}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.menu-item.danger{color:var(--red)} .menu-item.danger .ic{color:var(--red)}
.menu-pref{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 14px 8px}
.menu-pref>span{font-size:12px;font-weight:600;color:var(--ink-soft)}
.menu-seg{display:inline-flex;gap:3px;background:var(--panel-3);padding:3px;border-radius:8px}
.menu-seg button{border:0;background:transparent;padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft);
  transition:background .16s var(--ease-out),color .16s var(--ease-out),box-shadow .16s var(--ease-out)}
.menu-seg button:hover{color:var(--ink)}
.menu-seg button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}

#view{padding:var(--view-pad-t) var(--view-pad-x) 64px;max-width:var(--content-max);width:100%}
#view.view-enter{animation:view-in .22s var(--ease-out)}
@keyframes view-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------------- Buttons ---------------- */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;
  font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:border-color .15s var(--ease-out),color .15s var(--ease-out),background .15s var(--ease-out),transform .13s var(--ease-out),box-shadow .15s var(--ease-out)}
.btn:hover{border-color:var(--brand-2);color:var(--brand)}
.btn:active{transform:scale(.97)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(16,30,54,.12),0 4px 12px -4px rgba(27,79,138,.5)}
.btn.primary:hover{background:var(--brand-2);color:#fff;box-shadow:0 2px 4px rgba(16,30,54,.14),0 8px 20px -6px rgba(27,79,138,.55)}
.btn.primary .ic{color:#fff}
.btn.danger{color:var(--red);border-color:#f0cbc8}
.btn.danger:hover{background:var(--red-bg)}
.btn.small{padding:6px 10px;font-size:12px}
.icon-btn{border:1px solid transparent;background:transparent;padding:6px;border-radius:7px;color:var(--ink-soft);display:inline-flex;
  transition:background .15s var(--ease-out),color .15s var(--ease-out),transform .13s var(--ease-out)}
.icon-btn:hover{background:var(--panel-3);color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger:hover{background:var(--red-bg);color:var(--red)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:var(--card-pad)}
.card-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);margin:0 0 14px}
.section-head{display:flex;align-items:center;gap:9px;margin:2px 0 14px}
.section-head .ic{color:var(--brand-2)}
.section-head h2{font-size:15px;font-weight:700}
.spacer{flex:1}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--kpi-min),1fr));gap:var(--gap);margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative}
.kpi[data-goto]{transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out),border-color .16s var(--ease-out)}
@media(hover:hover) and (pointer:fine){.kpi[data-goto]:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#d3dce8}}
.kpi[data-goto]:active{transform:translateY(0) scale(.99)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-ico{width:32px;height:32px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.kpi-ico.green{background:var(--green-bg);color:var(--green)}
.kpi-ico.amber{background:var(--amber-bg);color:var(--amber)}
.kpi-ico.red{background:var(--red-bg);color:var(--red)}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:3px}
.progress{height:6px;border-radius:99px;background:var(--panel-3);margin-top:12px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--brand-2);transition:width .5s var(--ease-out)}
.progress.green>i{background:var(--green)} .progress.amber>i{background:var(--amber)} .progress.red>i{background:var(--red)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:var(--table-fs);white-space:nowrap}
thead th{position:relative;background:var(--panel-2);text-align:left;padding:var(--th-py) var(--row-px);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);font-weight:700}
tbody td{padding:var(--row-py) var(--row-px);border-bottom:1px solid var(--line)}
/* Colonne « texte long » : se replie au lieu de pousser le tableau en scroll horizontal */
td.wrap,th.wrap{white-space:normal;min-width:220px}
/* Colonnes étirables — poignée sur le bord droit de chaque en-tête */
.col-rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.col-rsz::after{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:1px;background:transparent;transition:background .15s var(--ease-out)}
.col-rsz:hover::after,.col-rsz.active::after{background:var(--brand-2)}
thead th:last-child .col-rsz{right:0}
body.col-resizing{cursor:col-resize;user-select:none}
/* Largeurs figées par l'utilisateur : on tronque proprement ce qui dépasse */
table.rsz{table-layout:fixed}
table.rsz td,table.rsz th{overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .13s var(--ease-out)}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{padding:var(--th-py) var(--row-px);font-weight:700;background:var(--panel-2);border-top:2px solid var(--line);font-variant-numeric:tabular-nums}
.t-strong{font-weight:700}.t-muted{color:var(--muted)}
.link{color:var(--brand);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.actions-cell{text-align:right;white-space:nowrap}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.5}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.b-prospect{background:var(--panel-3);color:var(--ink-soft)}
.b-devis,.b-envoye{background:var(--brand-ink);color:var(--brand)}
.b-relance,.b-encours,.b-attente-alt{background:var(--amber-bg);color:var(--amber)}
.b-attente{background:var(--panel-3);color:var(--ink-soft)}
.b-commande{background:var(--violet-bg);color:var(--violet)}
.b-receptionne,.b-facture,.b-accepte{background:var(--green-bg);color:var(--green)}
.b-perdu,.b-refuse{background:var(--red-bg);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-3);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.chip .ic{width:14px;height:14px;color:var(--muted)}
.deadline-ok{color:var(--green);font-weight:700}
.deadline-soon{color:var(--amber);font-weight:700}
.deadline-late{color:var(--red);font-weight:700}
.margin-good{color:var(--green);font-weight:700}
.margin-warn{color:var(--amber);font-weight:700}
.margin-bad{color:var(--red);font-weight:700}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);width:100%;
  transition:border-color .15s var(--ease-out),box-shadow .15s var(--ease-out)}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#cdd7e3}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(37,104,179,.14)}
.field .hint{font-size:11px;color:var(--muted)}
.field.inline{flex-direction:row;align-items:center;gap:8px}
.field.inline input{width:auto}

/* Modal */
#modal-root:empty,#menu-root:empty{display:none}
.modal-back{position:fixed;inset:0;background:rgba(14,27,43,.55);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;
  animation:back-in .2s var(--ease-out)}
@keyframes back-in{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;width:100%;max-width:600px;box-shadow:var(--shadow-lg);
  transform-origin:center;animation:modal-in .24s var(--ease-out)}
.modal.wide{max-width:min(1080px,94vw)}
.modal.xwide{max-width:min(1600px,96vw)}
.modal.xwide .modal-body{max-height:84vh}
@keyframes modal-in{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px}
.modal-head .icon-btn{margin-left:auto}
.modal-body{padding:20px 22px;max-height:72vh;overflow:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:15px 22px;border-top:1px solid var(--line)}

/* Toast */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:#111c2e;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;animation:toast-in .26s var(--ease-out);max-width:340px;display:flex;align-items:center;gap:9px}
@keyframes toast-in{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.toast .ic{width:16px;height:16px}
.toast.ok{background:#155e39}.toast.err{background:#8f1f18}

/* Empty */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .em-ico{width:52px;height:52px;border-radius:12px;background:var(--panel-3);color:var(--muted);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .em-ico .ic{width:26px;height:26px}
.empty h3{color:var(--ink-soft);margin-bottom:6px;font-size:15px}

/* Layout helpers */
.page-actions{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-line:last-child{border-bottom:0}
.stat-line b{font-variant-numeric:tabular-nums}
.todo-add{display:flex;gap:8px;margin-top:6px;margin-bottom:12px;flex-wrap:wrap}
.todo-add input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:var(--panel)}
.todo-add input[type=date]{flex:0 0 auto;min-width:0;width:auto;color:var(--ink-soft)}
.todo-add input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.todo-list{display:flex;flex-direction:column}
.todo-item{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:0}
.todo-check{display:inline-flex;cursor:pointer}
.todo-check input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.todo-text{flex:1;font-size:13.5px;color:var(--ink);word-break:break-word;cursor:text}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-edit,.todo-del{opacity:0;transition:opacity .15s var(--ease-out)}
.todo-item:hover .todo-edit,.todo-item:hover .todo-del{opacity:1}
@media(hover:none){.todo-edit,.todo-del{opacity:1}}
.todo-edit-input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--brand-2);border-radius:7px;
  font:inherit;font-size:13.5px;color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(37,104,179,.14)}
.todo-edit-input:focus{outline:0}
.todo-due{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700;
  border:1px solid var(--line);background:var(--panel-3);color:var(--ink-soft);white-space:nowrap;flex:none;
  transition:background .15s var(--ease-out),color .15s var(--ease-out),border-color .15s var(--ease-out),transform .13s var(--ease-out)}
.todo-due .ic{width:13px;height:13px}
.todo-due:active{transform:scale(.95)}
.todo-due.ok{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-ink)}
.todo-due.soon{background:var(--amber-bg);color:var(--amber);border-color:#f0dca6}
.todo-due.late{background:var(--red-bg);color:var(--red);border-color:#eec4c1}
.todo-due.add{opacity:0;background:transparent;border-style:dashed;color:var(--muted);font-weight:600}
.todo-item:hover .todo-due.add{opacity:1}
@media(hover:none){.todo-due.add{opacity:1}}
.todo-item.done .todo-due{background:var(--panel-3);color:var(--muted);border-color:var(--line)}
.todo-due-input{flex:none;padding:5px 8px;border:1px solid var(--brand-2);border-radius:6px;
  font:inherit;font-size:12px;color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(37,104,179,.14)}
.todo-due-input:focus{outline:0}
.todo-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.todo-main .todo-text{flex:0 0 auto}
.todo-status{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;max-width:100%;padding:2px 8px;border-radius:6px;
  font-size:11.5px;font-weight:600;line-height:1.35;border:1px solid var(--line);background:var(--panel-3);color:var(--ink-soft);cursor:pointer;
  transition:background .15s var(--ease-out),border-color .15s var(--ease-out),transform .13s var(--ease-out)}
.todo-status .ic{width:13px;height:13px;flex:none}
.todo-status .todo-status-note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-status .todo-status-date{color:var(--muted);font-weight:600;white-space:nowrap;flex:none}
.todo-status:active{transform:scale(.98)}
.todo-status.add{opacity:0;background:transparent;border-style:dashed;color:var(--muted)}
.todo-item:hover .todo-status.add{opacity:1}
@media(hover:none){.todo-status.add{opacity:1}}
.todo-item.done .todo-status{opacity:.65}
.todo-status-input{align-self:flex-start;min-width:200px;max-width:100%;padding:5px 8px;border:1px solid var(--brand-2);border-radius:6px;
  font:inherit;font-size:12px;color:var(--ink);background:var(--panel);box-shadow:0 0 0 3px rgba(37,104,179,.14)}
.todo-status-input:focus{outline:0}
.todo-wait{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700;
  border:1px solid var(--line);background:var(--panel-3);color:var(--ink-soft);white-space:nowrap;flex:none;cursor:pointer;
  transition:background .15s var(--ease-out),color .15s var(--ease-out),border-color .15s var(--ease-out),transform .13s var(--ease-out)}
.todo-wait .ic{width:13px;height:13px}
.todo-wait:active{transform:scale(.95)}
.todo-wait.on{background:var(--amber-bg);color:var(--amber);border-color:#f0dca6}
.todo-wait .todo-wait-date{font-weight:600;opacity:.8}
.todo-wait.add{opacity:0;background:transparent;border-style:dashed;color:var(--muted);font-weight:600}
.todo-item:hover .todo-wait.add{opacity:1}
@media(hover:none){.todo-wait.add{opacity:1}}
.todo-item.waiting{background:var(--amber-bg)}
.todo-item.waiting .todo-text{color:var(--ink-soft)}
.todo-item.done .todo-wait{opacity:.6}
.pill-tabs{display:inline-flex;gap:4px;background:var(--panel-3);padding:4px;border-radius:9px;margin-bottom:16px}
.pill-tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-soft);
  transition:background .18s var(--ease-out),color .18s var(--ease-out),box-shadow .18s var(--ease-out),transform .13s var(--ease-out)}
.pill-tabs button:not(.active):hover{color:var(--ink)}
.pill-tabs button:active{transform:scale(.97)}
.pill-tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap .ic{position:absolute;left:10px;color:var(--muted);width:16px;height:16px;pointer-events:none}
.search-wrap input{padding-left:32px;min-width:240px}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;
  transition:transform .15s var(--ease-out),box-shadow .15s var(--ease-out)}
@media(hover:hover) and (pointer:fine){.alert[data-goto]:hover{transform:translateX(2px);box-shadow:var(--shadow)}}
.alert[data-goto]:active{transform:translateX(2px) scale(.995)}
.alert .a-ico{flex:none;color:var(--muted)}
.alert.warn{border-color:#f0dca6;background:var(--amber-bg)} .alert.warn .a-ico{color:var(--amber)}
.alert.bad{border-color:#eec4c1;background:var(--red-bg)} .alert.bad .a-ico{color:var(--red)}
.alert .a-body{min-width:0}
.alert .a-act{margin-left:auto}

/* Bars */
.barchart{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:8px}
.barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barchart .bar{width:44%;background:var(--brand-2);border-radius:3px 3px 0 0;min-height:2px;transition:height .5s var(--ease-out)}
.barchart .bar.margin{background:var(--green)}
.barchart .bars{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.barchart .bar-lbl{font-size:10px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Cadences result */
.cad-out .grid-3{margin-bottom:0}
.cad-metric{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius);padding:16px 18px;background:#fff;box-shadow:var(--shadow)}
.cad-metric.green{border-left-color:var(--green)}
.cad-metric.amber{border-left-color:var(--amber)}
.cad-metric .cm-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:600}
.cad-metric .cm-value{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.cad-metric .cm-sub{font-size:12px;color:var(--muted)}
.cad-steps td{white-space:normal}

/* Calendar */
.cal-wrap{overflow-x:auto}
.cal-inner{min-width:720px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{margin-bottom:6px}
.cal-hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:4px 6px}
.cal-cell{min-height:104px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 6px;cursor:pointer;overflow:hidden;
  transition:border-color .14s var(--ease-out),box-shadow .14s var(--ease-out)}
.cal-cell:hover{border-color:var(--brand-2);box-shadow:var(--shadow-sm)}
.cal-ev{transition:transform .12s var(--ease-out)}
.cal-ev:active{transform:scale(.97)}
.cal-cell.out{background:var(--panel-2)}
.cal-cell.out .cal-daynum{color:var(--muted)}
.cal-cell.today{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2)}
.cal-daynum{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px}
.cal-ev{display:block;font-size:10.5px;font-weight:600;color:#fff;border-radius:4px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-more{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}

/* Pointages grid */
.point-grid th,.point-grid td{vertical-align:top}
.point-grid thead th{text-align:center}
.point-grid thead th:first-child{text-align:left}
.pcell-td{padding:6px 6px}
.pcell{display:flex;flex-direction:column;gap:4px;min-width:96px}
.pcell .ph{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
.pcell .po{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 4px;font-size:11.5px;background:#fff;max-width:120px}
.pcell .ph:focus,.pcell .po:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 2px rgba(37,104,179,.14)}
.point-grid .rowtot,.point-grid .coltot{font-weight:700}

/* BTE façon feuille Excel */
.xls{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;table-layout:fixed}
.xls td{border:1px solid #d5dce6;padding:0;height:27px;overflow:hidden;text-overflow:ellipsis}
.xls input{border:0;background:transparent;width:100%;height:25px;padding:0 8px;font-size:12.5px;font-family:inherit;color:var(--ink)}
.xls td.num{text-align:right}
.xls td.num input{text-align:right;font-variant-numeric:tabular-nums}
.xls input:focus{outline:2px solid var(--brand-2);outline-offset:-2px;background:#fff;border-radius:2px}
.xls .xls-inline{display:inline-block;width:80px}
.xls .xls-lbl{font-weight:700;text-align:right;padding:0 10px;background:#f6f8fb;white-space:nowrap}
.xls .xls-val{font-weight:800;padding:0 10px;font-variant-numeric:tabular-nums}
.xls .xls-bte{font-weight:800;text-align:center;font-size:15px;letter-spacing:3px;color:var(--brand);background:#f6f8fb}
.xls .xls-head td{background:#fff}
.xls .xls-colhead td{background:var(--panel-3);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;padding:6px 8px;color:var(--ink-soft)}
.xls .bte-sec td{background:#e7eef7;font-weight:700;padding:5px 9px;color:var(--ink)}
.xls .bte-sub td{background:#f6f8fb;font-weight:700}
.xls .tot,.xls .sub{padding:0 8px;font-variant-numeric:tabular-nums}
.xls .xls-act{text-align:center}
.xls .xls-act .icon-btn{padding:3px}

/* Timesheet (saisie des pointages) */
.ts-person{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.ts-avatar{width:44px;height:44px;border-radius:10px;background:var(--brand-ink);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.ts-workersel{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:700;font-size:14px;width:100%;background:#fff}
.ts-prog{margin-top:8px}
.ts-prog-lbl{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.ts-grid td,.ts-grid th{padding:6px 8px}
.ts-grid thead th{text-align:center}
.ts-grid thead th:nth-child(-n+3){text-align:left}
.ts-grid input,.ts-grid select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12.5px;background:#fff}
.ts-grid .ts-h{width:50px;text-align:right;font-variant-numeric:tabular-nums}
.ts-grid input:focus,.ts-grid select:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 2px rgba(37,104,179,.14)}
.ts-grid tbody tr:hover{background:var(--panel-2)}
.ts-grid .rtot{background:var(--panel-2)}

/* ---------------- Affichage adaptatif : largeur, densité, menu ----------------
   Les préférences sont posées sur <html> (data-width / data-density / data-nav)
   et stockées par poste — chacun règle l'outil selon la taille de son écran. */
html[data-width="confort"]{--content-max:1260px}
html[data-width="large"]{--content-max:1720px}
html[data-width="plein"]{--content-max:100%}

html[data-density="compact"]{
  --view-pad-t:16px;--view-pad-x:18px;--gap:11px;--card-pad:13px 15px;--kpi-min:196px;
  --row-py:6px;--row-px:10px;--th-py:8px;--table-fs:12.3px}
html[data-density="compact"] body{font-size:13px}
html[data-density="compact"] #topbar{height:52px}
html[data-density="compact"] .kpi{padding:12px 14px}
html[data-density="compact"] .kpi-value{font-size:22px}
html[data-density="compact"] .kpi-grid{margin-bottom:13px}
html[data-density="compact"] .page-actions,html[data-density="compact"] .filters{margin-bottom:11px}
html[data-density="compact"] .card-title{margin-bottom:10px}
html[data-density="compact"] .field input,html[data-density="compact"] .field select,
html[data-density="compact"] .field textarea{padding:7px 9px}

/* Écrans peu larges : on récupère la place perdue dans les marges */
@media(max-width:1400px){:root{--view-pad-x:20px}}
@media(max-width:1150px){:root{--view-pad-x:14px;--row-px:11px}}
/* Écrans peu hauts (portables 768 px) : on gagne des lignes visibles */
@media(max-height:800px){:root{--view-pad-t:16px;--row-py:8px}}

/* Menu latéral réduit aux icônes */
@media(min-width:921px){
  html[data-nav="compact"]{--sidebar-w:66px}
  html[data-nav="compact"] .nav-item>span,
  html[data-nav="compact"] .brand>div,
  html[data-nav="compact"] .mini-btn span,
  html[data-nav="compact"] .foot-note{display:none}
  html[data-nav="compact"] .brand{justify-content:center;padding:18px 8px 16px}
  html[data-nav="compact"] #nav{padding:10px 8px}
  html[data-nav="compact"] .nav-item{justify-content:center;padding:10px 0}
  html[data-nav="compact"] .nav-item.active::before{display:none}
  html[data-nav="compact"] .nav-group{font-size:0;height:1px;padding:0;margin:9px 10px;background:rgba(255,255,255,.09);border-radius:1px}
  html[data-nav="compact"] .sidebar-foot{padding:8px}
  html[data-nav="compact"] .foot-row{flex-direction:column}
  html[data-nav="compact"] .mini-btn{padding:9px 0}
}

@media(max-width:920px){
  :root{--sidebar-w:0px}
  #sidebar{transform:translateX(-100%);transition:transform .32s var(--ease-drawer);width:246px}
  #sidebar.open{transform:none}
  #main{margin-left:0}
  #menu-toggle{display:inline-flex}
  #nav-collapse{display:none}
  .form-grid,.grid-2,.grid-3{grid-template-columns:1fr}
  .menu{right:12px}
}

/* Reduced motion — moins et plus doux, pas zéro : on garde les fondus, on retire les déplacements */
@keyframes rm-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  #view.view-enter,.modal,.modal-back,.menu,.toast{animation:rm-fade .18s ease}
  .btn:active,.icon-btn:active,.mini-btn:active,.nav-item:active,.pill-tabs button:active,
  .kpi[data-goto]:hover,.kpi[data-goto]:active,.alert[data-goto]:hover,.alert[data-goto]:active,
  .cal-ev:active,.profile-btn:active{transform:none}
  #sidebar{transition:none}
}


/* ---------------- Documents d'exécution (PAQ / PPSPS / APRI / PdP) -------- */
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}

/* Liste des dossiers */
.doc-cards{display:flex;flex-direction:column;gap:var(--gap)}
.doc-card{padding:16px 18px}
.doc-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.doc-title{font-size:15px;font-weight:700}
.doc-lines{display:flex;flex-direction:column}
.doc-line{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--panel-3)}
.doc-line:last-child{border-bottom:0}
.dl-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--brand-soft);color:var(--brand)}
.dl-ico.amber{background:var(--amber-bg);color:var(--amber)}
.dl-ico.red{background:var(--red-bg);color:var(--red)}
.dl-ico.violet{background:var(--violet-bg);color:var(--violet)}
.dl-ico.green{background:var(--green-bg);color:var(--green)}
.dl-name{display:flex;flex-direction:column;min-width:210px;font-weight:700;font-size:13px}
.dl-name em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.dl-bar{flex:1;height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden;min-width:70px}
.dl-bar i{display:block;height:100%;background:var(--brand-2);border-radius:4px;transition:width .4s var(--ease-out)}
.doc-line.ok .dl-bar i{background:var(--green)}
.dl-pct{font-size:12px;font-weight:700;color:var(--ink-soft);width:38px;text-align:right}

/* Assistant */
.wz{display:grid;grid-template-columns:262px 1fr;gap:var(--gap);align-items:start}
.wz-rail{position:sticky;top:var(--view-pad-t);display:flex;flex-direction:column;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.wz-doc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:var(--brand-soft);color:var(--brand)}
.wz-doc.amber{background:var(--amber-bg);color:var(--amber)}
.wz-doc.red{background:var(--red-bg);color:var(--red)}
.wz-doc.violet{background:var(--violet-bg);color:var(--violet)}
.wz-doc.green{background:var(--green-bg);color:var(--green)}
.wz-doc b{display:block;font-size:14px}
.wz-doc em{font-style:normal;font-size:11.5px;opacity:.85;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz-prog{height:7px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.wz-prog i{display:block;height:100%;background:var(--brand-2);transition:width .4s var(--ease-out)}
.wz-secs{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.wz-sec{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:7px 8px;border-radius:7px;
  font-size:12.5px;color:var(--ink-soft);transition:background .15s}
.wz-sec:hover{background:var(--panel-2)}
.wz-sec.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
.wz-dot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:11px;color:#fff}
.wz-sec.ok .wz-dot{background:var(--green);border-color:var(--green)}
.wz-docs{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.wz-jump{display:flex;align-items:center;gap:7px;background:none;border:0;padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--ink-soft)}
.wz-jump span{flex:1;text-align:left}
.wz-jump b{font-size:11px;color:var(--muted)}
.wz-jump:hover{background:var(--panel-2)}
.wz-jump.active{background:var(--panel-3);font-weight:700;color:var(--ink)}

.wz-main{min-width:0}
.wz-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px 34px;box-shadow:var(--shadow);max-width:820px}
.wz-kicker{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-2);margin-bottom:10px}
.wz-kicker span{color:var(--muted);margin:0 4px}
.wz-q{font-size:21px;line-height:1.32;margin:0 0 6px}
.wz-req{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--red);
  background:var(--red-bg);border-radius:5px;padding:3px 7px;margin-left:9px;vertical-align:middle}
.wz-aide{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);
  background:var(--panel-2);border-left:3px solid var(--brand-2);border-radius:0 7px 7px 0;padding:9px 12px;margin:12px 0 0}
.wz-aide .ic{color:var(--brand-2);flex:none;margin-top:1px}
.wz-input{margin:20px 0 4px}
.wz-input input[type=text],.wz-input input[type=date],.wz-input input[type=tel],.wz-input input[type=email],
.wz-input input[type=number],.wz-input textarea,.wz-input select{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:15px;background:#fff;color:var(--ink)}
.wz-input textarea{resize:vertical;line-height:1.55}
.wz-input input:focus,.wz-input textarea:focus,.wz-input select:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(37,104,179,.14)}
.wz-unit{display:flex;align-items:center;gap:9px}
.wz-unit span{font-size:13px;color:var(--muted);font-weight:600}
.wz-nav{display:flex;align-items:center;gap:9px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}

.wz-choices{display:flex;gap:10px;flex-wrap:wrap}
.wz-choice{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:14px 30px;font-size:15px;font-weight:600;
  color:var(--ink-soft);transition:all .15s var(--ease-out)}
.wz-choice:hover{border-color:var(--brand-2);color:var(--brand)}
.wz-choice.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.wz-checks{display:flex;flex-direction:column;gap:7px}
.wz-check{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
  cursor:pointer;font-size:13.5px;background:#fff;transition:all .15s}
.wz-check:hover{border-color:#cdd7e3;background:var(--panel-2)}
.wz-check.on{border-color:var(--brand-2);background:var(--brand-soft);font-weight:600}
.wz-check input{margin:2px 0 0;accent-color:var(--brand-2);flex:none}
.wz-check.small{padding:7px 10px;font-size:12.5px}
.wz-liste table{width:100%;border-collapse:collapse;font-size:13px}
.wz-liste th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:0 6px 6px}
.wz-liste td{padding:0 3px 6px}
.wz-liste input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px}
.wz-liste input:focus{outline:0;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(37,104,179,.14)}

.wz-risq{display:flex;flex-direction:column;gap:12px}
.rq-block{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.rq-head{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:13.5px}
.rq-phases{display:flex;flex-direction:column;gap:5px;padding:11px 12px;max-height:288px;overflow:auto}
.rq-phases::-webkit-scrollbar{width:9px}
.rq-phases::-webkit-scrollbar-thumb{background:#cdd7e3;border-radius:5px;border:2px solid var(--panel)}
/* Le chevron natif pointe vers le bas : on l'oriente selon le sens de navigation. */
#wz-back .ic,#w-prev .ic{transform:rotate(90deg)}
#w-next .ic,#i-go .ic,#e-next .ic{transform:rotate(-90deg)}
.rq-total{font-size:13px;color:var(--ink-soft);background:var(--brand-soft);border-radius:8px;padding:11px 13px}

.wz-inter,.wz-end{text-align:center;padding:44px 34px}
.wz-inter-ok{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--green);
  background:var(--green-bg);border-radius:999px;padding:6px 14px;margin-bottom:16px}
.wz-inter h2{font-size:16px;color:var(--ink-soft);font-weight:600;margin:0 0 22px}
.wz-inter-next{font-size:25px;font-weight:700;color:var(--brand);line-height:1.3}
.wz-end-ico{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  background:var(--green-bg);color:var(--green)}
.wz-end-ico .ic{width:28px;height:28px}
.wz-end h2{font-size:20px;margin:0 0 8px}
.wz-end-acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:26px}

/* Aperçu document */
.doc-prev-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.doc-prev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:30px 34px;max-height:70vh;overflow:auto;
  font-size:12.5px;line-height:1.55}
.doc-prev .dc-cover{text-align:center;font-size:20px;font-weight:700;color:var(--brand);margin:0 0 14px;white-space:pre-line}
.doc-prev .dc-h1{font-size:15px;color:var(--brand);border-bottom:2px solid var(--brand);padding-bottom:4px;margin:22px 0 10px}
.doc-prev .dc-h2{font-size:13.5px;color:var(--brand);margin:16px 0 6px}
.doc-prev .dc-h3{font-size:12.5px;margin:12px 0 4px}
.doc-prev .dc-p{margin:6px 0}
.doc-prev .dc-note{margin:6px 0;font-style:italic;color:var(--ink-soft)}
.doc-prev .dc-ul{margin:6px 0;padding-left:19px}
.doc-prev .dc-chk{margin:6px 0;padding-left:2px;list-style:none}
.doc-prev .dc-chk li{padding:1px 0}
.doc-prev .dc-chk li.on{font-weight:600;color:var(--ink)}
.doc-prev .dc-tab{width:100%;border-collapse:collapse;margin:9px 0;font-size:11.5px}
.doc-prev .dc-tab th,.doc-prev .dc-tab td{border:1px solid #b8c2d0;padding:5px 7px;text-align:left;vertical-align:top}
.doc-prev .dc-tab thead th{background:var(--panel-3)}
.doc-prev .dc-tab.kv th{width:32%;background:var(--panel-2)}
.doc-prev .dc-pb{border-top:2px dashed var(--line);margin:24px 0}

@media (max-width:1000px){
  .wz{grid-template-columns:1fr}
  .wz-rail{position:static}
  .wz-card{padding:22px 20px}
  .wz-q{font-size:18px}
  .dl-name{min-width:130px}
  .dl-name em{display:none}
}
</style>

   ------------------------------------------------------------------------- */
const OBJECTIFS_DEFAUT = { caAnnuel: 750000, margeCible: 0.30, devisMois: 45, rdvMois: 4, delaiDevis: 7, delaiFacture: 7, delaiRapport: 7, delaiPaiement: 45, tauxHoraireMO: 45 };

/* -------------------------------------------------------------------------
   4. Store — multi-profils
   Méta : chargepro.v2.meta  { profiles:[{id,nom,agence}], currentId }
   Données par profil : chargepro.v2.data.<id>  (chargé à la demande)
   ------------------------------------------------------------------------- */
const META_KEY = 'chargepro.v2.meta';
const dataKey = id => 'chargepro.v2.data.' + id;

const DB = {
  meta: null,   // { profiles, currentId }
  data: null,   // données du profil courant

  loadMeta() {
    try { this.meta = JSON.parse(localStorage.getItem(META_KEY)); } catch { this.meta = null; }
    if (!this.meta || !Array.isArray(this.meta.profiles)) this.meta = { profiles: [], currentId: null };
    // migration éventuelle depuis l'ancienne version v1
    if (!this.meta.profiles.length) {
      let old = null; try { old = JSON.parse(localStorage.getItem('chargepro.v1')); } catch {}
      if (old) {
        const id = uid();
        this.meta = { profiles: [{ id, nom: 'Mon profil', agence: '' }], currentId: id };
        localStorage.setItem(dataKey(id), JSON.stringify(this.normalize(old)));
        localStorage.removeItem('chargepro.v1');
        this.saveMeta();
      }
    }
    return this.meta;
  },
  saveMeta() { localStorage.setItem(META_KEY, JSON.stringify(this.meta)); },

  normalize(d) {
    d = d || {};
    d.objectifs = Object.assign({}, OBJECTIFS_DEFAUT, d.objectifs || {});
    ['clients', 'chantiers', 'devis', 'ca', 'bte', 'prospection', 'factures', 'contrats', 'visites', 'equipes', 'pointages', 'commandes', 'dossiers'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
    d.devis.forEach(x => { if (x.otp === undefined) x.otp = ''; if (x.clientId === undefined) x.clientId = ''; if (x.derniereRelance === undefined) x.derniereRelance = ''; if (x.nbRelances === undefined) x.nbRelances = 0; if (x.horsComptes === undefined) x.horsComptes = false; });
    d.factures.forEach(x => { if (x.otp === undefined) x.otp = ''; });
    d.ca.forEach(x => { if (x.sourceType === undefined) { x.sourceType = ''; x.sourceId = ''; } });
    d.commandes.forEach(x => { if (x.dateReception === undefined) x.dateReception = ''; if (x.num === undefined) x.num = ''; });
    d.chantiers.forEach(x => { if (x.sourceDevisId === undefined) x.sourceDevisId = ''; });
    d.dossiers.forEach(x => { if (!x.rep || typeof x.rep !== 'object') x.rep = {}; });
    if (!Array.isArray(d.agenda)) d.agenda = [];
    if (!Array.isArray(d.todos)) d.todos = [];
    if (!Array.isArray(d.otps)) d.otps = [];
    d.pointages = migratePointages(d.pointages);
    d.bte = d.bte.map(migrateBte);
    return d;
  },
  emptyData() { return this.normalize({}); },

  loadProfile(id) {
    let d; try { d = JSON.parse(localStorage.getItem(dataKey(id))); } catch { d = null; }
    this.data = this.normalize(d || {});
    return this.data;
  },
  save() { if (this.currentProfile()) localStorage.setItem(dataKey(this.meta.currentId), JSON.stringify(this.data)); },

  currentProfile() { return this.meta.profiles.find(p => p.id === this.meta.currentId) || null; },
  createProfile(nom, agence, demo) {
    const id = uid();
    this.meta.profiles.push({ id, nom: nom || 'Nouveau profil', agence: agence || '' });
    this.meta.currentId = id;
    localStorage.setItem(dataKey(id), JSON.stringify(demo ? demoData() : this.emptyData()));
    this.saveMeta(); this.loadProfile(id);
    return id;
  },
  switchTo(id) { if (this.meta.profiles.some(p => p.id === id)) { this.meta.currentId = id; this.saveMeta(); this.loadProfile(id); } },
  renameProfile(id, nom, agence) { const p = this.meta.profiles.find(x => x.id === id); if (p) { p.nom = nom; p.agence = agence; this.saveMeta(); } },
  deleteProfile(id) {
    localStorage.removeItem(dataKey(id));
    this.meta.profiles = this.meta.profiles.filter(p => p.id !== id);
    if (this.meta.currentId === id) this.meta.currentId = this.meta.profiles[0] ? this.meta.profiles[0].id : null;
    this.saveMeta();
    if (this.meta.currentId) this.loadProfile(this.meta.currentId);
  },
};

/* Pointages : modèle en LIGNES hebdo (une ligne = imputation OTP d'un compagnon,
   heures par jour dans h[0..6]). Migration depuis l'ancien format journalier. */
function migratePointages(list) {
  if (!Array.isArray(list) || !list.length) return list || [];
  if (list[0].h) return list; // déjà en lignes
  const rows = {};
  list.forEach(p => {
    if (!p.jour) return;
    const sem = mondayISO(new Date(p.jour + 'T00:00:00'));
    const di = (new Date(p.jour + 'T00:00:00').getDay() + 6) % 7;
    const key = [p.workerKey, sem, p.otp || '', p.chantierNom || ''].join('|');

function toast(msg, kind = 'ok') {

  $('#toast-root').appendChild(t);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { t.style.transition = 'opacity .25s var(--ease-out),transform .25s var(--ease-out)'; t.style.opacity = '0'; if (!reduce) t.style.transform = 'translateY(16px) scale(.96)'; }, 2200);
  setTimeout(() => t.remove(), 2600);
}
function modal({ title, body, wide, xwide, footer }) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-back"><div class="modal ${xwide ? 'xwide' : wide ? 'wide' : ''}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>${icon('x')}</button></div>
    <div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  root.querySelector('[data-close]').onclick = close;
  root.querySelector('.modal-back').onclick = e => { if (e.target.classList.contains('modal-back')) close(); };
  return { root, close };
}
function confirmDialog(msg, onYes, label = 'Supprimer') {
  const m = modal({ title: 'Confirmation', body: `<p style="margin:0">${esc(msg)}</p>`,
    footer: `<button class="btn" data-no>Annuler</button><button class="btn danger" data-yes>${esc(label)}</button>` });
  m.root.querySelector('[data-no]').onclick = m.close;
  m.root.querySelector('[data-yes]').onclick = () => { m.close(); onYes(); };
}

const COLS_KEY = 'chargepro.cols';
const COL_MIN = 48; // largeur mini d'une colonne, en px
const Cols = {
  map: null,
  load() {
    if (!this.map) { let m = null; try { m = JSON.parse(localStorage.getItem(COLS_KEY)); } catch {} this.map = (m && typeof m === 'object') ? m : {}; }
    return this.map;
  },
  save() { try { localStorage.setItem(COLS_KEY, JSON.stringify(this.map)); } catch {} },
  get(key) { const v = this.load()[key]; return Array.isArray(v) ? v : null; },
  set(key, widths) { this.load()[key] = widths.map(w => Math.round(w)); this.save(); },
  clear(key) { this.load(); if (key) delete this.map[key]; else this.map = {}; this.save(); },
  any() { return Object.keys(this.load()).length > 0; }
};
const headCells = t => (t.tHead && t.tHead.rows.length) ? [...t.tHead.rows[0].cells] : [];
function colKey(t, i) { return current + '#' + i + ':' + headCells(t).length; }
// Fige les largeurs courantes : indispensable pour que l'étirement soit prévisible.
function freezeCols(t, widths) {
  headCells(t).forEach((th, i) => { th.style.width = widths[i] + 'px'; th.style.minWidth = '0'; });
  t.style.width = widths.reduce((a, b) => a + b, 0) + 'px';
  t.classList.add('rsz');
}
function measureCols(t) {
  const w = headCells(t).map(th => th.getBoundingClientRect().width);
  const slack = t.parentElement.clientWidth - w.reduce((a, b) => a + b, 0);
  if (slack > 1 && w.length) w[w.length - 1] += slack; // la dernière colonne absorbe l'espace libre
  return w;
}
function clearCols(t) {
  headCells(t).forEach(th => { th.style.width = ''; th.style.minWidth = ''; });
  t.style.width = ''; t.classList.remove('rsz');
}
function startColDrag(e, t, key, i, handle) {
  if (e.button) return;
  e.preventDefault(); e.stopPropagation();
  if (!t.classList.contains('rsz')) freezeCols(t, measureCols(t));
  const ths = headCells(t), startX = e.clientX, startW = parseFloat(ths[i].style.width);
  const total = () => ths.reduce((sum, th) => sum + parseFloat(th.style.width), 0);
  handle.classList.add('active'); document.body.classList.add('col-resizing');
  try { handle.setPointerCapture(e.pointerId); } catch {}
  const move = ev => { ths[i].style.width = Math.max(COL_MIN, startW + (ev.clientX - startX)) + 'px'; t.style.width = total() + 'px'; };
  const up = () => {
    handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up);
    handle.classList.remove('active'); document.body.classList.remove('col-resizing');
    Cols.set(key, ths.map(th => parseFloat(th.style.width)));
  };
  handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);

function setupResizable(t, key) {

  const saved = Cols.get(key);
  if (saved && saved.length === headCells(t).length) freezeCols(t, saved);
  headCells(t).forEach((th, i) => {

    h.className = 'col-rsz';

}

/* =========================================================================
   8. VUES
   ========================================================================= */
function marge(r) { return (+r.prixVente || 0) - (+r.fournitures || 0) - (+r.engins || 0) - (+r.moSmac || 0); }
const sameMonth = iso => { if (!iso) return false; const d = new Date(iso + 'T00:00:00'), n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); };

/* -- Finances / entretien : helpers partagés -- */
function factureEcheance(f) { return f.dateEmission ? addDays(f.dateEmission, +f.echeanceJours || DB.data.objectifs.delaiPaiement) : ''; }
function factureFlags(f) {
  const o = DB.data.objectifs, t = todayISO(), ech = factureEcheance(f);
  return { echeance: ech,
    retardEmission: f.statut === 'a_emettre' && f.dateFG && daysBetween(f.dateFG, t) > o.delaiFacture,
    retardPaiement: f.statut === 'emise' && ech && ech < t };
}
const contratActif = c => !c.dateFin || c.dateFin >= todayISO();
const contratVisitesFutures = c => DB.data.visites.filter(v => v.contratId === c.id && v.statut === 'planifiee' && v.datePrevue >= todayISO());
const contratAProgrammer = c => contratActif(c) && contratVisitesFutures(c).length === 0;
const rapportsEnRetard = () => DB.data.visites.filter(v => v.statut === 'realisee' && v.dateRealisee && !v.rapportDate && daysBetween(v.dateRealisee, todayISO()) > DB.data.objectifs.delaiRapport);
const rdvNouveauxMois = () => DB.data.prospection.filter(p => p.canal === 'rdv_nouveau' && sameMonth(p.date) && p.statut !== 'sans_suite').length;
const carnetCommandes = () => DB.data.chantiers.filter(c => ['commande', 'en_cours'].includes(c.statut)).reduce((s, c) => s + (+c.montantHT || 0), 0);

function collectActions() {
  const o = DB.data.objectifs, t = todayISO(), acts = [];
  DB.data.devis.filter(d => d.statut === 'attente').forEach(d => {
    const rest = o.delaiDevis - daysBetween(d.dateDemande, t);
    if (rest <= 2) acts.push({ tone: rest < 0 ? 'bad' : 'warn', ico: 'file', route: 'devis', urg: rest, title: `Devis à envoyer — ${d.objet || d.ref}`, badge: rest < 0 ? `Retard ${-rest} j` : rest === 0 ? "Aujourd'hui" : `${rest} j` });
  });
  DB.data.devis.filter(d => ['envoye', 'relance'].includes(d.statut) && d.relance && d.relance <= t).forEach(d => acts.push({ tone: 'warn', ico: 'bell', route: 'devis', urg: 0, title: `Relancer le devis — ${d.objet || d.ref}`, badge: `Relance ${fmtDate(d.relance)}` }));
  DB.data.factures.forEach(f => { const fl = factureFlags(f);
    if (fl.retardEmission) acts.push({ tone: 'bad', ico: 'receipt', route: 'factures', urg: -daysBetween(f.dateFG, t), title: `Facture à émettre — ${f.objet}`, badge: 'Retard émission' });
    if (fl.retardPaiement) acts.push({ tone: 'bad', ico: 'euro', route: 'factures', urg: -daysBetween(fl.echeance, t), title: `Impayé — ${f.client} · ${f.objet}`, badge: `Échéance ${fmtDate(fl.echeance)}` });
  });
  DB.data.contrats.filter(contratAProgrammer).forEach(c => acts.push({ tone: 'warn', ico: 'wrench', route: 'entretien', urg: 1, title: `Visite à programmer — ${esc(clientNom(c.clientId))} (${esc(c.nom)})`, badge: 'À programmer' }));
  rapportsEnRetard().forEach(vz => { const c = DB.data.contrats.find(x => x.id === vz.contratId); acts.push({ tone: 'bad', ico: 'file', route: 'entretien', urg: -daysBetween(vz.dateRealisee, t), title: `Rapport d'intervention en retard — ${c ? esc(clientNom(c.clientId)) : ''}`, badge: 'Sous 7 j' }); });
  DB.data.prospection.filter(p => p.prochaine && p.prochaine <= t && !['gagne', 'sans_suite'].includes(p.statut)).forEach(p => acts.push({ tone: 'warn', ico: 'phone', route: 'prospection', urg: 0, title: `Relance prospect — ${esc(p.nom)}`, badge: fmtDate(p.prochaine) }));
  return acts.sort((a, b) => a.urg - b.urg);
}

          <span class="a-ico">${icon(a.ico)}</span><div class="a-body"><b>${a.title}</b></div>

function renderTodos() {
  const host = $('#todo-card');
  if (!host) return;
  const todos = DB.data.todos || (DB.data.todos = []);
  const open = todos.filter(t => !t.done && !t.waiting).length;
  const waiting = todos.filter(t => !t.done && t.waiting).length;
  const rank = t => t.done ? 2 : (t.waiting ? 1 : 0); // actionnable · en attente · fait
  const sorted = todos.slice().sort((a, b) => {
    const ra = rank(a), rb = rank(b); if (ra !== rb) return ra - rb;
    const ad = a.due || '', bd = b.due || '';
    if (ad && bd) return ad < bd ? -1 : ad > bd ? 1 : 0;
    if (ad) return -1; if (bd) return 1;
    return 0;
  });
  const countChip = (open || waiting)
    ? `<span class="chip">${open ? open + ' à faire' : 'Rien à faire'}${waiting ? ' · ' + waiting + ' en attente' : ''}</span>`
    : `<span class="chip">Tout est fait ✓</span>`;
  host.innerHTML = `
    <div class="section-head">${icon('checkSquare')}<h2>Ma to-do list</h2><span class="spacer"></span>${countChip}</div>
    <div class="todo-add">

      <button class="btn primary small" id="todo-addbtn">${icon('plus')} Ajouter</button>
    </div>
    ${sorted.length ? `<div class="todo-list">${sorted.map(t => {
      const m = todoDueMeta(t);
      const due = m
        ? `<button class="todo-due ${m.cls}" data-due title="${m.title}">${icon('calendar', 'ic-sm')} ${fmtDate(t.due)}</button>`
        : `<button class="todo-due add" data-due title="Ajouter une échéance">${icon('calendar', 'ic-sm')} Échéance</button>`;
      const status = t.status
        ? `<button class="todo-status" data-status title="Avancement noté le ${fmtDate(t.statusDate)} — cliquez pour modifier">${icon('activity', 'ic-sm')}<span class="todo-status-note">${esc(t.status)}</span><span class="todo-status-date">· ${fmtDate(t.statusDate)}</span></button>`
        : `<button class="todo-status add" data-status title="Noter un état d'avancement">${icon('activity', 'ic-sm')} Avancement</button>`;
      const wait = (t.waiting && !t.done)
        ? `<button class="todo-wait on" data-wait title="En attente de retour depuis le ${fmtDate(t.waitingSince)} — cliquez pour reprendre la main">${icon('clock', 'ic-sm')} En attente<span class="todo-wait-date">· ${fmtDate(t.waitingSince)}</span></button>`
        : `<button class="todo-wait add" data-wait title="Marquer en attente de retour (la balle n'est plus dans votre camp)">${icon('clock', 'ic-sm')} En attente</button>`;
      return `<div class="todo-item ${t.done ? 'done' : ''} ${t.waiting && !t.done ? 'waiting' : ''}" data-id="${t.id}">
        <label class="todo-check"><input type="checkbox" class="todo-toggle" ${t.done ? 'checked' : ''}></label>
        <div class="todo-main">
          <span class="todo-text" title="Double-cliquez pour modifier">${esc(t.text)}</span>
          ${status}
        </div>
        ${wait}
        ${due}
        <button class="icon-btn todo-edit" title="Modifier">${icon('edit')}</button>
        <button class="icon-btn danger todo-del" title="Supprimer">${icon('trash')}</button>
      </div>`;
    }).join('')}</div>`
      : `<div class="t-muted" style="margin-top:8px">Aucune tâche pour le moment. Ajoutez ce que vous ne voulez pas oublier.</div>`}`;
  const addTodo = () => {
    const inp = $('#todo-input', host); const txt = (inp.value || '').trim();
    if (!txt) return;
    const due = ($('#todo-due', host).value || '');
    DB.data.todos.push({ id: uid(), text: txt, due, done: false, date: todayISO() });
    DB.save(); renderTodos(); const ni = $('#todo-input'); if (ni) ni.focus();
  };
  $('#todo-addbtn', host).onclick = addTodo;
  $('#todo-input', host).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addTodo(); } };
  $$('.todo-toggle', host).forEach(c => c.onchange = e => { const id = e.target.closest('.todo-item').dataset.id; const t = DB.data.todos.find(x => x.id === id); if (t) { t.done = e.target.checked; if (t.done) { t.waiting = false; t.waitingSince = ''; } DB.save(); renderTodos(); } });
  $$('.todo-wait', host).forEach(b => b.onclick = e => { const id = e.target.closest('.todo-item').dataset.id; const t = DB.data.todos.find(x => x.id === id); if (!t) return; t.waiting = !t.waiting; t.waitingSince = t.waiting ? todayISO() : ''; DB.save(); renderTodos(); });
  $$('.todo-del', host).forEach(b => b.onclick = e => { const id = e.target.closest('.todo-item').dataset.id; DB.data.todos = DB.data.todos.filter(x => x.id !== id); DB.save(); renderTodos(); });

  $$('.todo-status', host).forEach(b => b.onclick = e => beginEditStatus(e.target.closest('.todo-item')));
}
function todoDueMeta(t) {
  if (!t.due) return null;
  const d = daysBetween(todayISO(), t.due); // >0 : à venir · 0 : aujourd'hui · <0 : passé
  let cls = 'ok', title = 'Échéance : ' + fmtDate(t.due);
  if (!t.done) {
    if (d < 0) { cls = 'late'; title = 'En retard de ' + (-d) + ' j — échéance ' + fmtDate(t.due); }
    else if (d === 0) { cls = 'soon'; title = "Échéance aujourd'hui"; }
    else if (d <= 3) { cls = 'soon'; title = 'Dans ' + d + ' j — échéance ' + fmtDate(t.due); }
  }
  return { cls, title, d };
}
function beginEditDue(item) {
  if (!item || item.querySelector('.todo-due-input')) return;
  const id = item.dataset.id;
  const t = DB.data.todos.find(x => x.id === id);
  if (!t) return;
  const chip = item.querySelector('.todo-due');
  const input = document.createElement('input');
  input.type = 'date'; input.className = 'todo-due-input'; if (t.due) input.value = t.due;
  chip.replaceWith(input);
  input.focus(); if (input.showPicker) { try { input.showPicker(); } catch (e) {} }
  let settled = false;
  const commit = save => {
    if (settled) return; settled = true;
    if (save) { t.due = input.value || ''; DB.save(); }
    renderTodos();
  };
  input.onchange = () => commit(true);
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  };
  input.onblur = () => commit(true);
}
function beginEditStatus(item) {
  if (!item || item.querySelector('.todo-status-input')) return;
  const id = item.dataset.id;
  const t = DB.data.todos.find(x => x.id === id);
  if (!t) return;
  const chip = item.querySelector('.todo-status');
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'todo-status-input'; input.maxLength = 140;
  input.placeholder = 'Où en est cette tâche ?'; input.value = t.status || '';

  input.focus(); input.select();

    if (settled) return; settled = true;
    if (save) {
      const val = (input.value || '').trim();
      if (val !== (t.status || '')) {          // horodate à chaque modification
        t.status = val;
        t.statusDate = val ? todayISO() : '';
        DB.save();
      }
    }
    renderTodos();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
  };
  input.onblur = () => commit(true);
}
function beginEditTodo(item) {

function monthlyBarChart(yr) {

  const max = Math.max(1, ...caM);
  const bars = caM.map((val, i) => `<div class="bar-col" title="${MOIS[i]} — CA ${eur(val)} / Marge ${eur(maM[i])}">
    <div class="bars"><div class="bar" style="height:${val / max * 100}%"></div><div class="bar margin" style="height:${Math.max(0, maM[i]) / max * 100}%"></div></div>
    <div class="bar-lbl">${MOIS[i].slice(0, 3)}</div></div>`).join('');
  return `<div class="barchart">${bars}</div><div class="legend"><span><i style="background:var(--brand-2)"></i>Chiffre d'affaires</span><span><i style="background:var(--green)"></i>Marge brute</span></div>`;
}

/* ---------- Comptes OTP (un OTP regroupe plusieurs sites / devis) ---------- */
function otpRollup(code) {
  const chantiers = DB.data.chantiers.filter(c => c.otp === code);
  const devis = DB.data.devis.filter(d => d.otp === code && !d.horsComptes);
  const factures = DB.data.factures.filter(f => f.otp === code);
  const caLines = DB.data.ca.filter(r => r.otp === code);
  const montantDevis = devis.reduce((s, d) => s + (+d.montantHT || 0), 0);
  const ca = caLines.reduce((s, r) => s + (+r.prixVente || 0), 0);
  const margeCa = caLines.reduce((s, r) => s + marge(r), 0);
  const achats = commandesParOtp(code);
  const mo = moAllOtp(code);
  const factEmis = factures.filter(f => f.statut !== 'a_emettre').reduce((s, f) => s + (+f.montantHT || 0), 0);
  const encaisse = factures.filter(f => f.statut === 'payee').reduce((s, f) => s + (+f.montantHT || 0), 0);
  return { chantiers, devis, factures, caLines, montantDevis, ca, margeCa, achats, mo, factEmis, encaisse };
}

/* ---------- RAF — Reste à facturer (analyse par OTP) ----------
   Écran 1 : sélection d'un OTP (période / exercice) → « Exécuter ».
   Écran 2 : fiche d'analyse — dépenses imputées + reste à facturer. */
let rafOtp = '', rafPeriode = String(new Date().getMonth() + 1), rafExercice = String(new Date().getFullYear()), rafPerimetre = 'ytd', rafQ = '';
const RAF_PERIMETRES = { ytd: 'Cumulé à fin de période', month: 'Période seule (mois M)', all: 'Cumul — toutes périodes' };
function rafPer() {
  const m = Math.min(12, Math.max(1, parseInt(rafPeriode, 10) || 1)) - 1;
  const y = parseInt(rafExercice, 10) || new Date().getFullYear();
  return { m, y, mode: rafPerimetre };
}
function rafPerLabel() {
  const { m, y, mode } = rafPer();
  return mode === 'all' ? 'Cumul toutes périodes' : mode === 'month' ? MOIS[m] + ' ' + y + ' seul' : 'Cumulé à fin ' + MOIS[m] + ' ' + y;
}
// Flux : date dans le périmètre sélectionné · Stock : cumulé jusqu'à fin de période
function rafInScope(iso) {
  const { m, y, mode } = rafPer();
  if (mode === 'all') return true;
  if (!iso) return false;
  const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return false;
  const dy = d.getFullYear(), dm = d.getMonth();
  return mode === 'month' ? (dy === y && dm === m) : (dy < y || (dy === y && dm <= m));
}
function rafInCumul(iso) {
  const { m, y, mode } = rafPer();
  if (mode === 'all') return true;
  if (!iso) return false;
  const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return false;
  const dy = d.getFullYear(), dm = d.getMonth();
  return dy < y || (dy === y && dm <= m);
}
const rafCaIn = (l, cumul) => {
  const { m, y, mode } = rafPer();
  if (mode === 'all') return true;
  const ly = +l.annee, lm = +l.mois;
  return (mode === 'month' && !cumul) ? (ly === y && lm === m) : (ly < y || (ly === y && lm <= m));
};
// Main d'œuvre pointée sur l'OTP (heures × taux), filtrée par le périmètre
function rafMo(code, cumul) {
  let heures = 0, cout = 0; const rows = {};
  DB.data.pointages.forEach(p => {
    if (p.otp !== code || !p.h) return;
    const taux = tauxWorker(p.workerKey);
    p.h.forEach((h, i) => {
      if (!h) return;
      const iso = addDays(p.semaine, i);
      if (!(cumul ? rafInCumul(iso) : rafInScope(iso))) return;
      heures += +h; cout += (+h) * taux;
      const k = p.workerNom || '—';
      (rows[k] = rows[k] || { nom: k, heures: 0, cout: 0 });
      rows[k].heures += +h; rows[k].cout += (+h) * taux;
    });
  });
  return { heures, cout, list: Object.values(rows) };
}
/* Agrégat financier d'un OTP, filtré par le périmètre choisi.
   Flux (CA imputé, dépenses, facturé du mois) = périmètre ; stocks (facturé cumulé,
   reste à facturer) = cumulé à fin de période. Achats imputés = commandes RÉCEPTIONNÉES,
   les non réceptionnées sont comptées en « engagé ». */
function rafFinance(code) {
  const chantiers = DB.data.chantiers.filter(c => c.otp === code);
  const devis = DB.data.devis.filter(d => d.otp === code);
  const marche = chantiers.reduce((a, c) => a + (+c.montantHT || 0), 0) || devis.reduce((a, d) => a + (+d.montantHT || 0), 0);
  const caL = DB.data.ca.filter(x => x.otp === code);
  const ca = caL.filter(x => rafCaIn(x, false)).reduce((a, x) => a + (+x.prixVente || 0), 0);
  const caCumul = caL.filter(x => rafCaIn(x, true)).reduce((a, x) => a + (+x.prixVente || 0), 0);
  const cmds = DB.data.commandes.filter(c => c.otp === code);
  const achatsList = cmds.filter(c => c.dateReception && rafInScope(c.dateReception));
  const achats = achatsList.reduce((a, c) => a + (+c.montantHT || 0), 0);
  const achatsCumul = cmds.filter(c => c.dateReception && rafInCumul(c.dateReception)).reduce((a, c) => a + (+c.montantHT || 0), 0);
  const engage = cmds.filter(c => !c.dateReception).reduce((a, c) => a + (+c.montantHT || 0), 0);
  const moP = rafMo(code, false), moC = rafMo(code, true);
  const factures = DB.data.factures.filter(f => f.otp === code);
  const emises = factures.filter(f => f.statut !== 'a_emettre');
  const fact = emises.filter(f => rafInScope(f.dateEmission || f.dateFG)).reduce((a, f) => a + (+f.montantHT || 0), 0);
  const factCumul = emises.filter(f => rafInCumul(f.dateEmission || f.dateFG)).reduce((a, f) => a + (+f.montantHT || 0), 0);
  const encaisse = factures.filter(f => f.statut === 'payee' && rafInCumul(f.datePaiement || f.dateEmission || f.dateFG)).reduce((a, f) => a + (+f.montantHT || 0), 0);
  const dep = achats + moP.cout, depCumul = achatsCumul + moC.cout;
  // Référence = prix de vente HT (le « budget prévu »). Marge = PV HT − coûts imputés,
  // pourcentage rapporté au PV (marge brute). Indicateur de projet → coûts cumulés.
  const marge = marche - depCumul;
  const margePct = marche ? marge / marche : 0;
  const resultatPeriode = ca - dep;  // résultat du seul périmètre affiché (CA imputé − dépenses)
  return { code, chantiers, devis, factures, achatsList, marche,
    ca, caCumul, achats, achatsCumul, engage,
    mo: moP.cout, moCumul: moC.cout, moHeures: moP.heures, moList: moP.list,
    dep, depCumul, marge, margePct, resultatPeriode,
    fact, factCumul, encaisse, raf: marche - factCumul, pctFact: marche ? factCumul / marche : 0 };
}
// Budget prévu par nature : d'abord le(s) BTE de l'OTP, à défaut les lignes CA.
// Renvoie hasBudget=false pour les comptes sans budget (ex. PIP, Habitat 76…).
function rafBudget(code) {
  const lignes = DB.data.bte.filter(b => b.otp === code).flatMap(b => b.lignes || []);
  let mo = 0, four = 0, mat = 0;
  lignes.forEach(l => {
    const v = (+l.qte || 0) * (+l.pu || 0), c = (l.cat || '').toLowerCase();
    if (c.includes('main') || c.includes('œuvre') || c.includes('oeuvre')) mo += v;
    else if (c.includes('matériel') || c.includes('materiel') || c.includes('location') || c.includes('engin')) mat += v;
    else four += v; // fournitures, sous-traitance, études, autres
  });
  let tot = mo + four + mat, src = 'BTE';
  if (tot <= 0) {
    const cl = DB.data.ca.filter(x => x.otp === code);
    mo = cl.reduce((a, x) => a + (+x.moSmac || 0), 0);
    four = cl.reduce((a, x) => a + (+x.fournitures || 0), 0);
    mat = cl.reduce((a, x) => a + (+x.engins || 0), 0);
    tot = mo + four + mat; src = 'CA';
  }
  return { hasBudget: tot > 0, src, mo, four, mat, tot };
}
// Bandeau de sélection de période (partagé par les 2 écrans)
function rafPeriodControls() {
  return `<div class="field"><label>Période</label><select id="raf-per">${MOIS.map((m, i) => `<option value="${i + 1}" ${String(i + 1) === rafPeriode ? 'selected' : ''}>${i + 1} — ${m}</option>`).join('')}</select></div>
    <div class="field"><label>Exercice comptable</label><input id="raf-ex" type="number" value="${esc(rafExercice)}"></div>
    <div class="field"><label>Périmètre</label><select id="raf-scope">${Object.entries(RAF_PERIMETRES).map(([k, l]) => `<option value="${k}" ${rafPerimetre === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
}
function rafBindPeriod(v) {
  const re = () => renderRAF(v);
  const p = $('#raf-per'), x = $('#raf-ex'), sc = $('#raf-scope');
  if (p) p.onchange = e => { rafPeriode = e.target.value; re(); };
  if (x) x.onchange = e => { rafExercice = e.target.value; re(); };
  if (sc) sc.onchange = e => { rafPerimetre = e.target.value; re(); };
}
function renderRAF(v) {
  if (rafOtp) { rafAnalyse(v); return; }
  const all = otpDistinct();
  const codes = all.filter(c => !rafQ || (c + ' ' + otpLabel(c) + ' ' + clientNom(otpClientId(c))).toLowerCase().includes(rafQ.toLowerCase()));
  const fin = codes.map(c => rafFinance(c));
  const T = fin.reduce((a, f) => ({ marche: a.marche + f.marche, ca: a.ca + f.ca, dep: a.dep + f.dep, marge: a.marge + f.marge, fact: a.fact + f.factCumul, raf: a.raf + f.raf }), { marche: 0, ca: 0, dep: 0, marge: 0, fact: 0, raf: 0 });

    <div class="card card-pad" style="margin-bottom:16px">
      <div class="form-grid">
        <div class="field full"><label>Élément d'OTP (ouvrir la fiche d'analyse)</label>
          <select id="raf-otp"><option value="">— Choisir un OTP —</option>${all.map(c => `<option value="${esc(c)}">${esc(c)}${otpLabel(c) ? ' — ' + esc(otpLabel(c)) : ''}</option>`).join('')}</select></div>
        ${rafPeriodControls()}
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" id="raf-run">${icon('trend')} Exécuter</button></div>
    </div>
    <div class="filters"><span class="search-wrap">${icon('search')}<input id="raf-q" placeholder="Rechercher (OTP, libellé, client…)" value="${esc(rafQ)}"></span><span class="chip">${codes.length} OTP</span><span class="spacer"></span><button class="btn small" id="raf-list-csv">${icon('download')} Excel</button></div>
    ${codes.length ? `<div class="table-wrap"><table><thead><tr><th>OTP</th><th>Libellé</th><th>Client</th><th class="num" title="Prix de vente HT — la référence (budget prévu)">PV HT</th><th class="num">CA imputé</th><th class="num">Dépenses</th><th class="num" title="Prix de vente HT − coûts imputés cumulés">Marge</th><th class="num" title="Marge rapportée au prix de vente HT">% marge</th><th class="num">Facturé cum.</th><th class="num">Reste à facturer</th><th></th></tr></thead>
      <tbody>${fin.map(f => `<tr><td class="t-strong">${esc(f.code)}</td><td><span class="link" data-run="${esc(f.code)}">${esc(otpLabel(f.code) || '—')}</span></td><td class="t-muted">${esc(clientNom(otpClientId(f.code)))}</td>
        <td class="num">${eur(f.marche)}</td><td class="num">${eur(f.ca)}</td><td class="num">${eur(f.dep)}</td>
        <td class="num ${mCls(f.marge)}">${f.marche ? eur(f.marge) : '—'}</td><td class="num ${mCls(f.marge)}">${f.marche ? pct(f.margePct) : '—'}</td>
        <td class="num">${eur(f.factCumul)}</td><td class="num ${f.raf > 0 ? 'margin-bad' : 'margin-good'}">${eur(f.raf)}</td>
        <td class="actions-cell"><button class="icon-btn" data-run="${esc(f.code)}" title="Analyser">${icon('target')}</button></td></tr>`).join('')}</tbody>
      <tfoot><tr class="t-strong"><td colspan="3">TOTAL (${codes.length} OTP)</td><td class="num">${eur(T.marche)}</td><td class="num">${eur(T.ca)}</td><td class="num">${eur(T.dep)}</td><td class="num ${mCls(T.marge)}">${eur(T.marge)}</td><td class="num ${mCls(T.marge)}">${T.marche ? pct(Tpct) : '—'}</td><td class="num">${eur(T.fact)}</td><td class="num">${eur(T.raf)}</td><td></td></tr></tfoot></table></div>`
      : emptyState('target', 'Aucun OTP', 'Les OTP apparaissent dès qu\'ils sont utilisés sur un devis, un chantier, une facture ou un achat.')}`;

}
function rafAnalyse(v) {
  const code = rafOtp, F = rafFinance(code), bud = rafBudget(code);
  const meta = otpMeta(code) || {};
  const dual = rafPerimetre === 'month';   // afficher « Période » ET « Cumulé »
  const margePrev = F.marche - bud.tot, pctPrev = F.marche ? margePrev / F.marche : 0;
  const resteADepenser = bud.tot - F.depCumul;
  const pM = val => F.marche ? pct(val / F.marche) : '—';
  const mCls = x => x >= 0 ? 'margin-good' : 'margin-bad';
  const card = (label, val, sub, tone) => `<div class="cad-metric ${tone || ''}"><div class="cm-label">${label}</div><div class="cm-value" style="font-size:22px">${val}</div>${sub ? `<div class="cm-sub">${sub}</div>` : ''}</div>`;
  const lbl = t => `<div class="t-muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600">${t}</div>`;
  // ligne à 1 ou 2 colonnes de valeurs selon le périmètre
  const L = (label, per, cum, cls, strong) => `<tr class="${strong ? 't-strong' : ''}"><td>${label}</td>${dual ? `<td class="num ${cls || ''}">${per}</td>` : ''}<td class="num ${cls || ''}">${cum}</td></tr>`;
  const HD = (first) => `<thead><tr><th>${first}</th>${dual ? `<th class="num">${MOIS[rafPer().m]} ${rafPer().y}</th>` : ''}<th class="num">${dual ? 'Cumulé' : 'Montant'}</th></tr></thead>`;
  v.innerHTML = `
    <div class="page-actions"><button class="btn" id="raf-back">${icon('chevron')} Changer d'OTP</button><span class="spacer"></span><span class="chip">${rafPerLabel()}</span><button class="btn small" id="raf-csv">${icon('download')} Excel</button></div>
    <div class="card card-pad" style="margin-bottom:16px">
      <div class="section-head" style="margin-top:0">${icon('target')}<h2>Élément d'OTP ${esc(code)}</h2></div>
      <div class="grid-3" style="gap:10px 24px">
        <div>${lbl('Libellé')}<div class="t-strong">${esc(otpLabel(code) || '—')}</div></div>
        <div>${lbl("Client / donneur d'ordre")}<div class="t-strong">${esc(clientNom(otpClientId(code)))}</div></div>
        <div>${lbl("Date d'analyse")}<div class="t-strong">${fmtDate(todayISO())}</div></div>
      </div>
      <div class="form-grid" style="margin-top:14px">${rafPeriodControls()}</div>
      <div class="field full" style="margin-top:10px"><label>Commentaires</label><input id="raf-com" value="${esc(meta.rafComment || '')}" placeholder="Note d'analyse RAF (facultatif)…" maxlength="200"></div>
    </div>
    <div class="grid-3" style="margin-bottom:14px">
      ${card('Marché HT', eur(F.marche), F.chantiers.length + ' site(s)')}
      ${card('Facturé cumulé', eur(F.factCumul), 'Encaissé ' + eur(F.encaisse))}
      ${card('Reste à facturer', eur(F.raf), pct(F.pctFact) + ' facturé', F.raf > 0 ? 'amber' : 'green')}
    </div>
    <div class="grid-3" style="margin-bottom:18px">
